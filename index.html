function pickPanel(e) {
  var p = IX.ped[e.pid], list = ativos(), last = ultimo(e.sec);
  var mine = list.filter(function (f) { return f.sec === e.sec || f.id === last; })
    .sort(function (a, b) { return (b.id === last) - (a.id === last) || a.nome.localeCompare(b.nome); });
  var outros = list.filter(function (f) { return mine.indexOf(f) < 0; });
  var showAll = S.pick.all || !mine.length;
  function btn(f, cls) { return '<button class="pname ' + cls + '" data-a="pick-go" data-f="' + esc(f.id) + '">' + esc(f.nome) + '</button>'; }
  return '<div class="pick" role="group" aria-label="Quem vai executar">' +
    '<div class="row between"><b style="font-size:16px">Quem vai executar? <span class="muted" style="font-weight:600">' + esc(cliName(p)) + ' #' + esc(p.ped) + ' · ' + esc(nm(e.sec)) + '</span></b>' +
    '<button class="btn ghost sm" data-a="pick-cancel">Cancelar</button></div>' +
    '<div class="names">' + mine.map(function (f) { return btn(f, f.id === last ? 'last' : ''); }).join('') +
    (showAll ? outros.map(function (f) { return btn(f, 'oth'); }).join('') : '') +
    (!showAll && outros.length ? '<button class="pname oth" data-a="pick-all">Outros setores (' + outros.length + ')</button>' : '') + '</div>' +
    '<div style="margin-top:10px;font-size:13px" class="muted">Toque no nome para começar. Falta alguém? Cadastre em <b>Equipe</b>.</div></div>';
}

function runningOf(p) {
  return (IX.etByPid[p.pid] || []).filter(function (x) { return x.st === 'EXECUCAO'; });
}

/** Card resumido: uma linha por pedido. Tocar abre o card completo. */
function miniCard(e) {
  var p = IX.ped[e.pid];
  var i = p.rota.indexOf(e.sec);
  var late = isLate(p);
  var bar = p.rota.map(function (sid) {
    var d = feitas(p.pid, sid), pct = p.total ? Math.min(100, Math.round(100 * d / p.total)) : 0;
    var et = etapa(p.pid, sid), run = et && et.st === 'EXECUCAO';
    return '<span class="seg' + (sid === e.sec ? ' cur' : '') + (d >= p.total ? ' full' : '') + (run ? ' run' : '') + '" title="' + esc(nm(sid)) + ': ' + d + '/' + p.total + (run ? ' · produzindo agora' + (et.resp ? ' (' + esc(et.resp) + ')' : '') : '') + '"><span style="width:' + pct + '%"></span></span>';
  }).join('');
  var rn = runningOf(p);
  var now = rn.length ? '<span class="prodnow"><span class="live-dot"></span>Produzindo: ' + rn.map(function (x) { return esc(nm(x.sec)) + (x.resp ? ' (' + esc(x.resp.split(' ')[0]) + ')' : ''); }).join(', ') + '</span>' : '';
  return '<div class="mcard' + (e.st === 'EXECUCAO' ? ' isrun' : '') + '">' +
    '<button class="mtog" data-a="toggle" data-id="' + e.id + '" aria-expanded="false" aria-label="Abrir ' + esc(cliName(p)) + ' pedido ' + esc(p.ped) + '">' +
      '<span class="mid"><span class="mcli">' + esc(cliName(p)) + '<span class="pn">#' + esc(p.ped) + '</span>' +
        (p.extras.indexOf(e.sec) >= 0 ? '<span class="pill p-extra" style="font-size:12px">Incluído</span>' : '') + '</span>' +
        '<span class="mmeta"><span class="mono">' + esc(p.cod) + '</span> · Prazo ' + br(p.prazo) + (late ? ' · <span class="lt">Atrasado</span>' : '') + '</span></span>' +
      '<span class="mbar"><span class="segs" aria-hidden="true">' + bar + '</span>' +
        (now || '<span class="mmeta">Etapa ' + (i + 1) + ' de ' + p.rota.length + ' · prontas ' + lastDone(p) + '/' + p.total + '</span>') + '</span>' +
      '<span class="mq"><b>' + falta(e) + '</b><span class="mmeta">pç faltam</span></span>' +
    '</button>' +
    '<span class="mst">' + statusPill(e) + timerHtml(e, 'tsm') + (e.resp && e.st !== 'AGUARDANDO' ? '<span class="resp">' + esc(e.resp) + '</span>' : '') + '</span>' +
    '<span class="mact">' + mainBtn(e, 'md') +
      '<button class="chev" data-a="toggle" data-id="' + e.id + '" aria-expanded="false" aria-label="Abrir detalhes">' + I.down + '</button></span>' +
    (S.pick && S.pick.id === e.id ? pickPanel(e) : '') +
  '</div>';
}

/** Card completo (aberto). */
function orderCard(e) {
  var p = IX.ped[e.pid];
  var i = p.rota.indexOf(e.sec);
  var prev = i > 0 ? p.rota[i - 1] : null;
  var late = isLate(p);
  var confirming = S.conf && S.conf.id === e.id;

  var acts = mainBtn(e);
  if (e.st !== 'AGUARDANDO' && !confirming) {
    acts += '<button class="btn soft" data-a="report" data-id="' + e.id + '">' + I.plus + 'Apontar peças</button>' +
      '<button class="btn dark" data-a="finish" data-id="' + e.id + '">' + I.check + 'Finalizar setor</button>';
  }

  var steps = p.rota.map(function (sid) {
    var d = feitas(p.pid, sid), et = etapa(p.pid, sid);
    if (et && et.st === 'EXECUCAO') return '<div class="step s-run"><span class="who"><span class="live-dot"></span>' + esc(nm(sid)) + (sid === e.sec ? ' · aqui' : '') + '</span><span class="v">' + d + '/' + p.total + '</span><span class="who">' + (et.resp ? esc(et.resp) : 'produzindo') + '</span></div>';
    if (sid === e.sec) return '<div class="step s-cur"><span>' + esc(nm(sid)) + ' · aqui</span><span class="v">' + d + '/' + p.total + '</span></div>';
    if (d >= p.total) return '<div class="step s-full"><span>' + esc(nm(sid)) + ' ' + I.checkG + '</span><span class="v">' + d + '/' + p.total + '</span></div>';
    if (d > 0) return '<div class="step s-part"><span>' + esc(nm(sid)) + '</span><span class="v">' + d + '/' + p.total + '</span></div>';
    return '<div class="step s-none"><span>' + esc(nm(sid)) + '</span><span class="v">0/' + p.total + '</span></div>';
  }).join('');

  var h = '<div class="ocard' + (e.st === 'EXECUCAO' ? ' isrun' : '') + '">' +
    '<div class="ohead"><button class="btn ghost sm" data-a="toggle" data-id="' + e.id + '" aria-expanded="true">' + I.up + 'Recolher</button></div>' +
    '<div class="otop">' +
    '<div class="oinfo"><div class="row" style="gap:8px"><span class="cli">' + esc(cliName(p)) + '</span><span class="muted" style="font-weight:600">Pedido #' + esc(p.ped) + '</span>' +
    (late ? '<span class="pill p-late">Atrasado</span>' : '') +
    (p.extras.indexOf(e.sec) >= 0 ? '<span class="pill p-extra">Setor incluído</span>' : '') + '</div>' +
    '<div class="mono" style="font-size:15px;margin-top:4px">' + esc(p.cod) + '</div>' +
    (p.obs ? '<div class="muted" style="font-size:13px;margin-top:4px">' + esc(p.obs) + '</div>' : '') +
    '<div class="muted" style="font-size:14px;margin-top:6px">Prazo ' + br(p.prazo) + ' · ' + (prev ? esc(nm(prev)) + ' já fez ' + feitas(p.pid, prev) + ' pç' : 'Primeira etapa da rota') + '</div></div>' +
    '<div class="oqty"><div><span class="n">' + falta(e) + '</span> <span class="muted" style="font-size:14px">pç faltam</span></div>' +
    '<div class="muted" style="font-size:13px;margin-top:6px">Feitas aqui <b class="mono" style="color:var(--ink)">' + e.feitas + '</b> de ' + p.total + '</div></div>' +
    '<div class="ostat">' + statusPill(e) + '<div>' + timerHtml(e) + '</div>' + (e.resp && e.st !== 'AGUARDANDO' ? '<div class="resp">' + (e.st === 'EXECUCAO' ? 'Com ' : 'Último: ') + esc(e.resp) + '</div>' : '') + '</div>' +
    '<div class="oact">' + acts + '</div></div>' +
    '<div class="oprog"><div class="row between" style="margin-bottom:10px"><span style="font-size:14px;font-weight:800">Andamento do pedido · ' + p.total + ' pç</span>' +
    '<span class="row" style="gap:12px"><span class="muted" style="font-size:14px">Prontas no fim da rota: <b class="mono" style="color:var(--ink)">' + lastDone(p) + '</b> de ' + p.total + '</span>' +
    '<button class="more" data-a="menu" data-id="' + e.id + '" aria-label="Mais opções do pedido" aria-expanded="' + (S.menu === e.id) + '">' + I.dots + '</button></span></div>' +
    '<div class="steps">' + steps + '</div>' +
    (runningOf(p).length ? '<div class="muted" style="font-size:12.5px;margin-top:8px">Em abóbora piscando: setor produzindo este pedido agora, com o nome de quem está trabalhando.</div>' : '') + '</div>';
  if (S.pick && S.pick.id === e.id) h += pickPanel(e);

  if (S.menu === e.id) {
    var addable = S.data.setores.filter(function (s) { return p.rota.indexOf(s.id) < 0; });
    h += '<div class="panel pu"><div class="row between" style="margin-bottom:4px"><strong style="font-size:16px">Incluir setor na rota deste pedido</strong>' +
      '<button class="btn ghost sm" style="min-height:40px" data-a="menu" data-id="' + e.id + '">Fechar</button></div>' +
      '<div style="font-size:14px;margin-bottom:12px">Vale só para o pedido #' + esc(p.ped) + '. O cadastro do artigo não muda. O setor escolhido recebe este pedido na hora.</div>' +
      (addable.length ? '<div class="row" style="gap:8px">' + addable.map(function (s) {
        return '<button class="addsec" data-a="add-sec" data-pid="' + esc(p.pid) + '" data-sec="' + esc(s.id) + '">' + I.plus + esc(s.nome) + '</button>';
      }).join('') + '</div>' : '<div style="font-size:14px">Este pedido já passa por todos os setores.</div>') + '</div>';
  }

  if (confirming) {
    var c = S.conf; var fin = c.mode === 'final';
    h += '<div class="panel"><div style="display:flex;flex-direction:column;gap:6px">' +
      '<label for="cq" style="font-size:14px;font-weight:700">' + (fin ? 'Quantas peças ainda saem para fechar?' : 'Quantas peças ficaram prontas agora?') + '</label>' +
      '<input id="cq" type="number" inputmode="numeric" min="0" step="1" value="' + esc(c.qty) + '" placeholder="0"></div>' +
      '<div class="muted grow" style="font-size:14px;padding-bottom:6px">' + (fin
        ? 'Faltam ' + falta(e) + ' pç. Ao confirmar, o setor fecha para este pedido, mesmo que o total seja menor.'
        : 'O cronômetro continua rodando. O número atualiza o andamento deste pedido em todos os setores.') + '</div>' +
      '<div class="row" style="gap:10px"><button class="btn ghost" style="min-height:52px" data-a="conf-cancel">Cancelar</button>' +
      '<button class="btn pri" style="min-height:52px" data-a="conf-ok">' + (fin ? 'Finalizar setor' : 'Apontar') + '</button></div>' +
      (c.err ? '<div class="err" role="alert">' + esc(c.err) + '</div>' : '') + '</div>';
  }
  return h + '</div>';
}

/* ---------- Novo pedido ---------- */
function vNovo() {
  var d = S.data, f = S.np, a = IX.art[f.art];
  var npCli = f.cli || (a ? a.cli : '') || d.clientes[0] || '';
  var cliOpts = d.clientes.slice();
  if (npCli && cliOpts.indexOf(npCli) < 0) cliOpts.unshift(npCli);
  var opts = d.artigos.slice().sort(function (x, y) { return x.cli.localeCompare(y.cli) || x.cod.localeCompare(y.cod); }).map(function (x) {
    return '<option value="' + esc(x.cod) + '"' + (x.cod === f.art ? ' selected' : '') + '>' + esc(x.cod + ' · ' + (x.cli || 'sem cliente') + (x.rota.length ? '' : ' (sem rota)')) + '</option>';
  }).join('');
  var rota = a && a.rota.length
    ? '<div class="row" style="gap:8px">' + a.rota.map(function (s, i) { return '<span class="tag"><span class="k">' + (i + 1) + '</span>' + esc(nm(s)) + '</span>'; }).join('') + '</div>'
    : '<div class="err">Este artigo ainda não tem rota. Defina os setores em Artigos e rotas antes de criar o pedido.</div>';

  var h = '<h1>Novo pedido</h1><p class="sub mb">Ao criar, o pedido aparece na hora em todos os setores da rota do artigo.</p><div class="cols">' +
    '<div class="col"><div class="form">' +
    '<label class="f full" for="np-art">Artigo<select class="in" id="np-art">' + opts + '</select></label>' +
    '<label class="f" for="np-ped">Nº do pedido<input class="in mono" id="np-ped" value="' + esc(f.ped) + '" placeholder="6801" autocomplete="off"></label>' +
    '<label class="f" for="np-qtd">Quantidade<input class="in mono" id="np-qtd" type="number" inputmode="numeric" min="1" step="1" value="' + esc(f.qtd) + '" placeholder="300"></label>' +
    '<label class="f" for="np-prazo">Data de entrega<input class="in" id="np-prazo" type="date" value="' + esc(f.prazo) + '"></label>' +
    '<label class="f" for="np-cli">Cliente<select class="in" id="np-cli">' + cliOpts.map(function (c) { return '<option' + (c === npCli ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label></div>' +
    '<div class="box" style="margin-top:18px;background:var(--bg);border:none"><div style="font-size:14px;font-weight:700;margin-bottom:8px">Vai cair nestes setores agora</div>' + rota + '</div>' +
    (f.err ? '<div class="err" role="alert" style="margin-top:12px">' + esc(f.err) + '</div>' : '') +
    '<button class="btn pri wide" style="margin-top:16px" data-a="np-create"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Criando…' : 'Criar pedido') + '</button></div>';

  var peds = d.pedidos.slice().sort(function (x, y) { return String(x.prazo).localeCompare(String(y.prazo)); });
  h += '<div class="col"><h2 style="font-size:20px">Pedidos em aberto <span class="mono muted" style="font-size:16px">' + peds.length + '</span></h2><div class="alist">' +
    (peds.length ? peds.map(function (p) {
      return '<div><div class="row" style="gap:6px 12px;align-items:baseline"><b>' + esc(cliName(p)) + ' #' + esc(p.ped) + '</b><span class="mono" style="font-size:15px">' + esc(p.cod) + '</span>' +
        '<span class="muted" style="font-size:14px">Prazo ' + br(p.prazo) + '</span>' + (isLate(p) ? '<span class="pill p-late">Atrasado</span>' : '') +
        '<span class="muted" style="font-size:14px;margin-left:auto">Prontas <b class="mono" style="color:var(--ink)">' + lastDone(p) + '</b> de ' + p.total + '</span></div>' +
        '<div style="font-size:14px;margin-top:6px"><b style="color:var(--or-ink)">' + p.rota.length + ' setores</b> · ' + p.rota.map(nm).map(esc).join(' → ') + '</div></div>';
    }).join('') : '<p class="muted">Nenhum pedido em aberto.</p>') + '</div></div></div>';
  return h;
}

/* ---------- Artigos e rotas ---------- */
function vArt() {
  var d = S.data, f = S.fa;
  var cliOpts = d.clientes.slice();
  if (f.cli && cliOpts.indexOf(f.cli) < 0) cliOpts.unshift(f.cli);
  var h = '<h1>Artigos e rotas</h1><p class="sub mb">Defina por quais setores cada artigo passa, na ordem. Todo pedido do artigo já nasce nesses setores.</p><div class="cols">';

  h += '<div class="col"><div class="row between" style="margin-bottom:14px"><h2 style="font-size:20px;margin:0">' + (f.editar ? 'Editar artigo' : 'Novo artigo') + '</h2>' +
    (f.editar ? '<button class="btn ghost sm" data-a="fa-new">Novo artigo</button>' : '') + '</div><div class="form">' +
    '<label class="f" for="fa-cod">Código<input class="in mono" id="fa-cod" value="' + esc(f.cod) + '" placeholder="4131.0226.00" autocomplete="off"' + (f.editar ? ' readonly' : '') + '></label>' +
    '<label class="f" for="fa-cli">Cliente<input class="in" id="fa-cli" list="fa-clis" value="' + esc(f.cli) + '" placeholder="Nome do cliente" autocomplete="off"><datalist id="fa-clis">' + cliOpts.map(function (c) { return '<option value="' + esc(c) + '">'; }).join('') + '</datalist></label>' +
    '<label class="f" for="fa-desc">Descrição<input class="in" id="fa-desc" value="' + esc(f.desc) + '" placeholder="Chicote módulo mesa" autocomplete="off"></label>' +
    '<label class="f" for="fa-tempo">Tempo por peça (min)<input class="in mono" id="fa-tempo" type="number" min="0" step="0.5" value="' + esc(f.tempo) + '" placeholder="2"></label></div>' +
    '<h3 style="margin:20px 0 4px;font-size:16px">Setores da rota</h3><p class="muted" style="margin:0 0 12px;font-size:14px">Toque nos setores na ordem em que a peça passa. Toque de novo para tirar.</p>' +
    '<div class="row" style="gap:8px">' + d.setores.map(function (s) {
      var i = f.rota.indexOf(s.id);
      return '<button class="chipsel' + (i >= 0 ? ' on' : '') + '" data-a="fa-toggle" data-sec="' + esc(s.id) + '" aria-pressed="' + (i >= 0) + '">' + (i >= 0 ? '<span class="k">' + (i + 1) + '</span>' : '') + esc(s.nome) + '</button>';
    }).join('') + '</div>' +
    '<div class="box" style="margin-top:16px;background:var(--bg);border:none"><div style="font-size:14px;font-weight:700;margin-bottom:8px">Rota definida</div>' +
    (f.rota.length ? '<div style="display:flex;flex-direction:column;gap:6px">' + f.rota.map(function (s, i) {
      return '<div class="rline"><span class="mono" style="font-weight:600;color:var(--or-ink);min-width:22px">' + (i + 1) + '</span><b style="flex:1">' + esc(nm(s)) + '</b>' +
        '<button class="ib" data-a="fa-up" data-i="' + i + '" aria-label="Mover ' + esc(nm(s)) + ' para cima">' + I.up + '</button>' +
        '<button class="ib" data-a="fa-down" data-i="' + i + '" aria-label="Mover ' + esc(nm(s)) + ' para baixo">' + I.down + '</button>' +
        '<button class="ib" style="color:var(--rd-ink)" data-a="fa-rm" data-i="' + i + '" aria-label="Tirar ' + esc(nm(s)) + ' da rota">' + I.x + '</button></div>';
    }).join('') + '</div>' : '<div class="muted" style="font-size:14px">Nenhum setor escolhido ainda.</div>') + '</div>' +
    (f.editar ? '<p class="muted" style="font-size:13px;margin:10px 0 0">A rota nova vale para os próximos pedidos. Pedidos já criados mantêm a rota deles.</p>' : '') +
    (f.err ? '<div class="err" role="alert" style="margin-top:12px">' + esc(f.err) + '</div>' : '') +
    '<button class="btn pri wide" style="margin-top:16px" data-a="fa-save"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Salvando…' : 'Salvar artigo') + '</button></div>';

  var semRota = d.artigos.filter(function (a) { return !a.rota.length; }).length;
  h += '<div class="col"><h2 style="font-size:20px">Artigos cadastrados <span class="mono muted" style="font-size:16px">' + d.artigos.length + '</span></h2>' +
    (semRota ? '<p style="margin:0 0 10px;font-size:14px" class="muted"><b style="color:var(--rd-ink)">' + semRota + ' sem rota</b> · eles não podem gerar pedidos até a rota ser definida.</p>' : '') +
    '<label class="sr" for="fa-filtro">Filtrar artigos</label><input class="in" id="fa-filtro" type="search" value="' + esc(f.filtro) + '" placeholder="Filtrar por código ou cliente" style="margin-bottom:6px" autocomplete="off">' +
    '<div class="alist" id="alist">' + artList() + '</div></div></div>';
  return h;
}

function artList() {
  var q = S.fa.filtro.trim().toLowerCase();
  var arr = S.data.artigos.filter(function (a) { return !q || (a.cod + ' ' + a.cli + ' ' + a.desc).toLowerCase().indexOf(q) >= 0; })
    .sort(function (x, y) { return (x.rota.length ? 1 : 0) - (y.rota.length ? 1 : 0) || x.cli.localeCompare(y.cli) || x.cod.localeCompare(y.cod); });
  if (!arr.length) return '<p class="muted">Nenhum artigo encontrado.</p>';
  return arr.map(function (a) {
    return '<div><div class="row" style="gap:6px 12px;align-items:baseline"><b class="mono">' + esc(a.cod) + '</b><span class="muted" style="font-weight:700;font-size:14px">' + esc(a.cli) + '</span>' +
      (a.desc ? '<span class="muted" style="font-size:14px">' + esc(a.desc) + '</span>' : '') +
      '<span class="muted" style="font-size:13px;margin-left:auto">' + (a.tempo ? esc(a.tempo) + ' min/pç' : '') + '</span>' +
      '<button class="btn ghost sm" style="min-height:40px" data-a="fa-edit" data-cod="' + esc(a.cod) + '">Editar</button></div>' +
      '<div style="font-size:14px;margin-top:6px">' + (a.rota.length
        ? '<b style="color:var(--or-ink)">' + a.rota.length + ' etapas</b> · ' + a.rota.map(nm).map(esc).join(' → ')
        : '<b style="color:var(--rd-ink)">Sem rota definida</b>') + '</div></div>';
  }).join('');
}

/* ---------- Utilitários de tempo ---------- */
var SEC_CORES = ['#475569', '#A16207', '#2563EB', '#0E7490', '#7C3AED', '#BE185D', '#047857', '#B91C1C', '#0F766E', '#4D7C0F', '#9333EA'];
function corSec(id) { var i = ordSec(id); return SEC_CORES[(i < 0 ? 0 : i) % SEC_CORES.length]; }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dstr(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hm(ms) { var d = new Date(ms - S.offset); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); }
function dur(ms) { var m = Math.max(0, Math.round(ms / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + 'h' + pad2(m % 60); }
function hoje() { return S.data && S.data.today ? S.data.today : dstr(new Date()); }
function diasAtras(n) { var d = new Date(hoje() + 'T12:00:00'); d.setDate(d.getDate() - n); return dstr(d); }
function brData(s) { return s ? s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4) : ''; }
function fimS(x) { return x.fim || nowMs(); }

function fetchTo(fn, payload, holder, key) {
  holder.loading = true; render();
  return call(fn, payload).then(function (r) { holder.loading = false; holder[key] = r; render(); })
    .catch(function () { holder.loading = false; toast('Sem conexão com o servidor. Tente de novo.', true); render(); });
}

/* =====================================================================
   Equipe: cadastro, onde cada um está agora, mapa do dia e histórico
   ===================================================================== */
function trabalhosAgora(fid) {
  return S.data.etapas.filter(function (e) { return e.rid === fid && e.st === 'EXECUCAO'; });
}

function vEquipe() {
  var E = S.eq;
  if (E.sel && IX.func[E.sel]) return vFuncionario(IX.func[E.sel]);
  var fs = S.data.funcionarios || [];
  var at = fs.filter(function (f) { return f.ativo; });
  var prod = at.filter(function (f) { return trabalhosAgora(f.id).length; });
  var podeCad = tem('pcp');
  var h = '<div class="row between mb"><div><h1>Equipe</h1><p class="sub">Onde cada funcionário está agora. Toque em um nome para ver o mapa do dia e o histórico.</p></div>' +
    '<div class="row"><div class="stat"><div class="n" style="color:#C2410C">' + prod.length + '</div><div class="l">produzindo agora</div></div>' +
    '<div class="stat"><div class="n">' + at.length + '</div><div class="l">funcionários ativos</div></div>' +
    (podeCad ? '<button class="btn pri md" data-a="ff-new">' + I.plus + 'Cadastrar funcionário</button>' : '') + '</div></div>';

  if (E.showForm && podeCad) h += funcForm();

  if (!fs.length) {
    return h + '<div class="empty"><h2 style="margin:0">Cadastre a equipe</h2><p class="muted" style="margin:6px 0 14px">Com os funcionários cadastrados, o app pergunta quem vai executar ao dar o play, e você acompanha o dia de cada um.</p>' + (podeCad ? '<button class="btn pri" data-a="ff-new">' + I.plus + 'Cadastrar funcionário</button>' : '') + '</div>';
  }
  var ord = at.slice().sort(function (a, b) { return (trabalhosAgora(b.id).length ? 1 : 0) - (trabalhosAgora(a.id).length ? 1 : 0) || a.nome.localeCompare(b.nome); });
  h += '<div class="fgrid">' + ord.map(function (f) {
    var jobs = trabalhosAgora(f.id);
    var pausado = !jobs.length && S.data.etapas.filter(function (e) { return e.rid === f.id && e.st === 'PAUSADO'; })[0];
    var body = jobs.length ? jobs.map(function (e) {
      var p = IX.ped[e.pid];
      return '<div class="job"><span class="prodnow"><span class="live-dot"></span>' + esc(nm(e.sec)) + '</span>' +
        '<b>' + esc(cliName(p)) + ' #' + esc(p.ped) + '</b> · <span class="mono">' + esc(p.cod) + '</span><br>' +
        'desde ' + hm(e.t0) + ' · ' + timerHtml(e, 'mono') + ' · ' + e.feitas + '/' + p.total + ' pç</div>';
    }).join('') : pausado ? '<div class="muted" style="font-size:13.5px">Parado. Último trabalho: ' + esc(nm(pausado.sec)) + ' · ' + esc(cliName(IX.ped[pausado.pid])) + ' #' + esc(IX.ped[pausado.pid].ped) + '</div>'
      : '<div class="muted" style="font-size:13.5px">Sem atividade agora.</div>';
    return '<button class="fcard' + (jobs.length ? ' on' : '') + '" data-a="eq-open" data-f="' + esc(f.id) + '">' +
      '<span class="row between" style="width:100%"><span class="fn">' + esc(f.nome) + '</span>' +
      (jobs.length ? '<span class="pill" style="background:#EA580C;color:#fff">Produzindo</span>' : '<span class="pill p-fila">Livre</span>') + '</span>' +
      '<span class="fs">Setor principal: ' + esc(f.sec ? nm(f.sec) : 'não definido') + '</span>' + body + '</button>';
  }).join('') + '</div>';

  var inat = fs.filter(function (f) { return !f.ativo; });
  h += '<details class="more-sec"><summary>Cadastro da equipe (' + fs.length + ')</summary><div class="list">' + fs.map(function (f) {
    return '<div><b>' + esc(f.nome) + '</b><span class="muted">' + esc(f.sec ? nm(f.sec) : 'sem setor') + '</span>' +
      (f.ativo ? '' : '<span class="pill p-fila">Inativo</span>') +
      (podeCad ? '<button class="btn ghost sm" style="margin-left:auto;min-height:40px" data-a="ff-edit" data-f="' + esc(f.id) + '">Editar</button>' : '') + '</div>';
  }).join('') + '</div>' + (inat.length ? '<p class="muted" style="font-size:13px">Inativos não aparecem na escolha do responsável.</p>' : '') + '</details>';
  return h;
}

function funcForm() {
  var f = S.eq.form || { id: '', nome: '', sec: '', ativo: true, err: '' };
  return '<div class="col" style="margin-bottom:18px;flex-basis:auto"><div class="row between" style="margin-bottom:12px"><h2 style="margin:0">' + (f.id ? 'Editar funcionário' : 'Novo funcionário') + '</h2>' +
    '<button class="btn ghost sm" data-a="ff-cancel">Fechar</button></div><div class="form">' +
    '<label class="f" for="ff-nome">Nome<input class="in" id="ff-nome" value="' + esc(f.nome) + '" placeholder="Maria Souza" autocomplete="off"></label>' +
    '<label class="f" for="ff-sec">Setor principal<select class="in" id="ff-sec"><option value="">Nenhum</option>' + S.data.setores.map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (s.id === f.sec ? ' selected' : '') + '>' + esc(s.nome) + '</option>';
    }).join('') + '</select></label>' +
    (f.id ? '<label class="f full" style="flex-direction:row;align-items:center;gap:10px;font-weight:600"><input type="checkbox" id="ff-ativo"' + (f.ativo ? ' checked' : '') + ' style="width:22px;height:22px"> Ativo (aparece na escolha do responsável)</label>' : '') +
    '</div><p class="muted" style="font-size:13px;margin:10px 0 0">O setor principal faz o nome aparecer primeiro quando alguém der o play naquele setor. Ele pode trabalhar em qualquer setor.</p>' +
    (f.err ? '<div class="err" role="alert" style="margin-top:10px">' + esc(f.err) + '</div>' : '') +
    '<button class="btn pri wide" style="margin-top:14px" data-a="ff-save"' + (S.busy ? ' disabled' : '') + '>' + (S.busy ? 'Salvando…' : 'Salvar') + '</button></div>';
}

function vFuncionario(f) {
  var E = S.eq;
  if (!E.date) E.date = hoje();
  var jobs = trabalhosAgora(f.id);
  var h = '<button class="back" data-a="eq-back">' + I.back + 'Toda a equipe</button>' +
    '<div class="row between" style="margin-bottom:14px"><div><h1>' + esc(f.nome) + '</h1><p class="sub">Setor principal: ' + esc(f.sec ? nm(f.sec) : 'não definido') + '</p></div>' +
    (jobs.length ? '<div class="job" style="font-size:15px">' + jobs.map(function (e) {
      var p = IX.ped[e.pid];
      return '<span class="prodnow"><span class="live-dot"></span>Produzindo agora em ' + esc(nm(e.sec)) + '</span><b>' + esc(cliName(p)) + ' #' + esc(p.ped) + '</b> · ' + esc(p.cod) + ' · ' + timerHtml(e, 'mono');
    }).join('<br>') + '</div>' : '<span class="pill p-fila">Sem atividade agora</span>') + '</div>';

  h += '<div class="row mb"><div class="seg-tabs" role="tablist">' +
    '<button role="tab" class="' + (E.tab === 'dia' ? 'on' : '') + '" aria-selected="' + (E.tab === 'dia') + '" data-a="eq-tab" data-t="dia">Mapa do dia</button>' +
    '<button role="tab" class="' + (E.tab === 'hist' ? 'on' : '') + '" aria-selected="' + (E.tab === 'hist') + '" data-a="eq-tab" data-t="hist">Histórico</button></div>';
  if (E.tab === 'dia') {
    h += '<label class="row" style="gap:8px;font-weight:700;font-size:14px" for="eq-date">Dia <input class="in" style="width:180px" type="date" id="eq-date" value="' + esc(E.date) + '"></label>' +
      '<button class="btn ghost sm" data-a="eq-day" data-d="-1">‹ Dia anterior</button><button class="btn ghost sm" data-a="eq-day" data-d="1">Próximo dia ›</button>';
  } else {
    h += [7, 30, 90].map(function (n) { return '<button class="chip' + (E.dias === n ? ' on' : '') + '" data-a="eq-dias" data-n="' + n + '">Últimos ' + n + ' dias</button>'; }).join('');
  }
  h += '</div>';

  if (E.loading) return h + '<div class="loading" style="padding:40px 0">Carregando…</div>';
  return h + (E.tab === 'dia' ? mapaDia(f) : historico(f));
}

function mapaDia(f) {
  var r = S.eq.dia;
  if (!r || r.key !== f.id + '|' + S.eq.date) { setTimeout(function () { loadDia(f.id); }, 0); return '<div class="loading" style="padding:40px 0">Carregando…</div>'; }
  var ss = r.sessoes.slice().sort(function (a, b) { return a.ini - b.ini; });
  if (!ss.length) return '<div class="empty"><h2 style="margin:0">Nenhum trabalho registrado em ' + brData(S.eq.date) + '</h2><p class="muted" style="margin:6px 0 0">Os registros aparecem quando ' + esc(f.nome.split(' ')[0]) + ' for escolhido ao dar o play em algum pedido.</p></div>';
  var d0 = new Date(S.eq.date + 'T00:00:00').getTime() + S.offset;
  var a = Math.min(d0 + 6 * 3600000, ss[0].ini), b = Math.max(d0 + 18 * 3600000, fimS(ss[ss.length - 1]));
  a = a - (a - d0) % 3600000; b = b + (3600000 - (b - d0) % 3600000) % 3600000;
  var span = b - a;
  function pct(t) { return ((t - a) / span * 100).toFixed(2); }
  var hrs = '', lbl = '';
  for (var t = a; t <= b; t += 3600000) { hrs += '<span class="hr" style="left:' + pct(t) + '%"></span>'; lbl += '<span style="left:' + pct(t) + '%">' + hm(t).slice(0, 2) + 'h</span>'; }
  var tot = 0, pcs = 0, peds = {}, secs = {};
  ss.forEach(function (x) { tot += fimS(x) - x.ini; pcs += x.pecas; peds[x.pid] = 1; secs[x.sec] = 1; });
  var blocks = ss.map(function (x) {
    var w = (fimS(x) - x.ini) / span * 100;
    return '<span class="blk' + (x.fim ? '' : ' open') + '" style="left:' + pct(x.ini) + '%;width:' + Math.max(0.6, w).toFixed(2) + '%;background:' + corSec(x.sec) + '" title="' + hm(x.ini) + '–' + (x.fim ? hm(x.fim) : 'agora') + ' · ' + esc(nm(x.sec)) + ' · ' + esc(x.cli) + ' #' + esc(x.ped) + '">' +
      (w > 7 ? esc(nm(x.sec)) + '<br>#' + esc(x.ped) : '') + '</span>';
  }).join('');
  var leg = Object.keys(secs).map(function (s) { return '<span><i style="background:' + corSec(s) + '"></i>' + esc(nm(s)) + '</span>'; }).join('');

  var rows = '', prev = null;
  ss.forEach(function (x) {
    if (prev && x.ini - fimS(prev) > 60000) rows += '<tr class="gap"><td>' + hm(fimS(prev)) + '–' + hm(x.ini) + '</td><td colspan="5">Intervalo de ' + dur(x.ini - fimS(prev)) + ' sem registro</td></tr>';
    rows += '<tr><td class="mono">' + hm(x.ini) + '–' + (x.fim ? hm(x.fim) : '<b style="color:#C2410C">agora</b>') + '</td>' +
      '<td><b>' + dur(fimS(x) - x.ini) + '</b></td>' +
      '<td><span class="legend" style="margin:0"><span><i style="background:' + corSec(x.sec) + '"></i>' + esc(nm(x.sec)) + '</span></span></td>' +
      '<td><b>' + esc(x.cli || 'Sem cliente') + ' #' + esc(x.ped) + '</b><br><span class="mono muted" style="font-size:12.5px">' + esc(x.cod) + '</span></td>' +
      '<td class="mono">' + x.pecas + ' pç</td>' +
      '<td class="muted" style="font-size:13px">' + esc(fimTxt(x)) + '</td></tr>';
    prev = x;
  });
  return '<div class="kpis">' +
    kpi(dur(tot), 'tempo produzindo') + kpi(pcs, 'peças apontadas') + kpi(Object.keys(peds).length, 'pedidos') + kpi(hm(ss[0].ini) + '–' + (ss[ss.length - 1].fim ? hm(ss[ss.length - 1].fim) : 'agora'), 'primeiro início – último fim') + '</div>' +
    '<h2>Linha do tempo · ' + brData(S.eq.date) + '</h2>' +
    '<div class="tl" role="img" aria-label="Linha do tempo do dia">' + hrs + blocks + '</div><div class="tlx" aria-hidden="true">' + lbl + '</div>' +
    '<div class="legend">' + leg + '</div>' +
    '<h2 style="margin-top:18px">O que fez no dia</h2><div class="scroll"><table class="tbl"><thead><tr><th>Horário</th><th>Duração</th><th>Setor</th><th>Pedido · artigo</th><th>Peças</th><th>Terminou com</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function fimTxt(x) {
  if (!x.fim) return 'Em andamento';
  return ({ 'PAUSA': 'Pausa', 'FINALIZAÇÃO': 'Finalizou o setor', 'PAUSA GERAL': 'Pausa geral (fim de turno)', 'PAUSA DO SETOR': 'Pausa do setor', 'TROCA': 'Troca de responsável' })[x.tipo] || x.tipo;
}
function kpi(v, l) { return '<div class="stat"><div class="n">' + esc(v) + '</div><div class="l">' + esc(l) + '</div></div>'; }

function loadDia(fid) {
  var key = fid + '|' + S.eq.date;
  if (S.eq.loading) return;
  S.eq.loading = true; render();
  call('getSessoes', { func: fid, de: S.eq.date, ate: S.eq.date }).then(function (r) { S.eq.loading = false; r.key = key; S.eq.dia = r; render(); })
    .catch(function () { S.eq.loading = false; S.eq.dia = { key: key, sessoes: [] }; toast('Sem conexão com o servidor.', true); render(); });
}
function loadHist(fid) {
  var key = fid + '|' + S.eq.dias;
  if (S.eq.loading) return;
  S.eq.loading = true; render();
  call('getSessoes', { func: fid, de: diasAtras(S.eq.dias - 1), ate: hoje() }).then(function (r) { S.eq.loading = false; r.key = key; S.eq.hist = r; render(); })
    .catch(function () { S.eq.loading = false; S.eq.hist = { key: key, sessoes: [] }; toast('Sem conexão com o servidor.', true); render(); });
}

function agrupa(ss, keyFn) {
  var m = {};
  ss.forEach(function (x) {
    var k = keyFn(x);
    var g = m[k] = m[k] || { k: k, ms: 0, pecas: 0, n: 0, peds: {}, x: x };
    g.ms += fimS(x) - x.ini; g.pecas += x.pecas; g.n++; g.peds[x.pid] = 1;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return b.ms - a.ms; });
}

function historico(f) {
  var r = S.eq.hist;
  if (!r || r.key !== f.id + '|' + S.eq.dias) { setTimeout(function () { loadHist(f.id); }, 0); return '<div class="loading" style="padding:40px 0">Carregando…</div>'; }
  var ss = r.sessoes;
  if (!ss.length) return '<div class="empty"><h2 style="margin:0">Nenhum trabalho registrado nos últimos ' + S.eq.dias + ' dias</h2></div>';
  var tot = 0, pcs = 0;
  ss.forEach(function (x) { tot += fimS(x) - x.ini; pcs += x.pecas; });
  var porSetor = agrupa(ss, function (x) { return x.sec; });
  var porArt = agrupa(ss, function (x) { return x.cod; });
  var porDia = agrupa(ss, function (x) { return dstr(new Date(x.ini - S.offset)); }).sort(function (a, b) { return a.k < b.k ? 1 : -1; });
  var max = porSetor[0].ms;
  var h = '<div class="kpis">' + kpi(dur(tot), 'tempo produzindo') + kpi(pcs, 'peças apontadas') + kpi(porDia.length, 'dias com registro') + kpi(porArt.length, 'artigos diferentes') + '</div>';
  h += '<div class="cols"><div class="col"><h2>Por setor (processo)</h2><table class="tbl"><thead><tr><th>Setor</th><th>Tempo</th><th></th><th>Peças</th></tr></thead><tbody>' +
    porSetor.map(function (g) {
      return '<tr><td><span class="legend" style="margin:0"><span><i style="background:' + corSec(g.k) + '"></i>' + esc(nm(g.k)) + '</span></span></td><td><b>' + dur(g.ms) + '</b></td>' +
        '<td style="width:35%"><div class="bar"><span style="width:' + Math.round(g.ms / max * 100) + '%;background:' + corSec(g.k) + '"></span></div></td><td class="mono">' + g.pecas + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  h += '<div class="col"><h2>Por artigo</h2><table class="tbl"><thead><tr><th>Artigo</th><th>Tempo</th><th>Peças</th><th>Pedidos</th><th></th></tr></thead><tbody>' +
    porArt.map(function (g) {
      return '<tr><td><b class="mono">' + esc(g.k) + '</b><br><span class="muted" style="font-size:12.5px">' + esc(g.x.cli) + '</span></td><td><b>' + dur(g.ms) + '</b></td><td class="mono">' + g.pecas + '</td><td class="mono">' + Object.keys(g.peds).length + '</td>' +
        '<td><button class="btn ghost sm" style="min-height:38px" data-a="pcp-go" data-cod="' + esc(g.k) + '">Ver artigo</button></td></tr>';
    }).join('') + '</tbody></table></div></div>';
  h += '<h2 style="margin-top:18px">Dia a dia</h2><table class="tbl"><thead><tr><th>Dia</th><th>Tempo</th><th>Peças</th><th>Setores</th><th></th></tr></thead><tbody>' +
    porDia.map(function (g) {
      var secs = {}; ss.forEach(function (x) { if (dstr(new Date(x.ini - S.offset)) === g.k) secs[nm(x.sec)] = 1; });
      return '<tr><td>' + brData(g.k) + '</td><td><b>' + dur(g.ms) + '</b></td><td class="mono">' + g.pecas + '</td><td class="muted" style="font-size:13px">' + esc(Object.keys(secs).join(', ')) + '</td>' +
        '<td><button class="btn ghost sm" style="min-height:38px" data-a="eq-goday" data-d="' + g.k + '">Ver o dia</button></td></tr>';
    }).join('') + '</tbody></table>';
  return h;
}

/* =====================================================================
   PCP: consulta por artigo
   ===================================================================== */
function vPcp() {
  var P = S.pcp;
  var h = '<h1>PCP · Consulta por artigo</h1><p class="sub mb">Puxe um artigo para ver em que pé está cada pedido em cada setor, quem trabalhou e quanto tempo levou.</p>' +
    '<div class="tools" style="margin-bottom:6px"><label class="sr" for="pcp-q">Buscar artigo</label>' +
    '<input id="pcp-q" type="search" value="' + esc(P.q) + '" placeholder="Digite o código ou o cliente (ex.: PT00383)" autocomplete="off">' +
    (P.cod ? '<button class="btn ghost md" data-a="pcp-refresh">Atualizar</button>' : '') + '</div>' +
    '<div id="pcp-sugg">' + pcpSugg() + '</div>';
  if (P.loading) return h + '<div class="loading" style="padding:40px 0">Carregando…</div>';
  if (!P.data || P.data.cod !== P.cod) return h + (P.cod ? '' : '<div class="empty" style="margin-top:14px"><h2 style="margin:0">Escolha um artigo</h2><p class="muted" style="margin:6px 0 0">Digite parte do código ou o nome do cliente e toque no artigo.</p></div>');
  return h + pcpArtigo(P.data);
}

function pcpSugg() {
  var q = S.pcp.q.trim().toLowerCase();
  if (!q) return '';
  var abertos = {};
  S.data.pedidos.forEach(function (p) { abertos[p.cod] = (abertos[p.cod] || 0) + 1; });
  var arr = S.data.artigos.filter(function (a) { return (a.cod + ' ' + a.cli + ' ' + a.desc).toLowerCase().indexOf(q) >= 0; })
    .sort(function (a, b) { return (abertos[b.cod] || 0) - (abertos[a.cod] || 0) || a.cod.localeCompare(b.cod); }).slice(0, 12);
  if (!arr.length) return '<p class="muted">Nenhum artigo encontrado.</p>';
  return '<div class="sugg">' + arr.map(function (a) {
    return '<button class="chip' + (a.cod === S.pcp.cod ? ' on' : '') + '" data-a="pcp-go" data-cod="' + esc(a.cod) + '"><b class="mono">' + esc(a.cod) + '</b> ' + esc(a.cli) + (abertos[a.cod] ? ' <span class="n">' + abertos[a.cod] + ' em aberto</span>' : '') + '</button>';
  }).join('') + '</div>';
}

function pcpArtigo(d) {
  var a = IX.art[d.cod] || { cod: d.cod, cli: '', desc: '', rota: [] };
  var etBy = {};
  d.etapas.forEach(function (e) { (etBy[e.pid] = etBy[e.pid] || {})[e.sec] = e; });
  var cols = [];
  a.rota.forEach(function (s) { if (cols.indexOf(s) < 0) cols.push(s); });
  d.etapas.forEach(function (e) { if (cols.indexOf(e.sec) < 0) cols.push(e.sec); });
  cols.sort(function (x, y) { return ordSec(x) - ordSec(y); });
  var abertos = d.pedidos.filter(function (p) { return p.status !== 'ENTREGUE'; });
  var fechados = d.pedidos.filter(function (p) { return p.status === 'ENTREGUE'; });
  var running = d.etapas.filter(function (e) { return e.st === 'EXECUCAO'; }).length;
  var pecasAbertas = abertos.reduce(function (s, p) { return s + p.total; }, 0);

  var h = '<div class="box" style="margin-top:14px"><div class="row between"><div><div class="mono" style="font-size:22px;font-weight:600">' + esc(d.cod) + '</div>' +
    '<div class="muted">' + esc(a.cli || 'Sem cliente') + (a.desc ? ' · ' + esc(a.desc) : '') + (a.tempo ? ' · ' + esc(a.tempo) + ' min/pç cadastrado' : '') + '</div></div>' +
    '<div class="row" style="gap:6px">' + (a.rota.length ? a.rota.map(function (s, i) { return '<span class="tag"><span class="k">' + (i + 1) + '</span>' + esc(nm(s)) + '</span>'; }).join('') : '<span class="err" style="width:auto">Sem rota definida</span>') + '</div></div></div>';
  h += '<div class="kpis">' + kpi(abertos.length, 'pedidos em aberto') + kpi(pecasAbertas, 'peças em aberto') + kpi(running, 'setores produzindo agora') + kpi(fechados.length, 'pedidos concluídos') + '</div>';

  function tabela(list, titulo) {
    if (!list.length) return '';
    return '<h2 style="margin-top:16px">' + titulo + '</h2><div class="scroll"><table class="tbl"><thead><tr><th>Pedido</th>' + cols.map(function (s) { return '<th>' + esc(nm(s)) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      list.map(function (p) {
        var late = p.status !== 'ENTREGUE' && p.prazo && p.prazo < hoje();
        return '<tr><td style="white-space:nowrap"><b>' + esc(p.cli || 'Sem cliente') + ' #' + esc(p.ped) + '</b><br><span class="muted" style="font-size:12.5px">' + p.total + ' pç · prazo ' + br(p.prazo) + '</span>' + (late ? ' <span class="pill p-late" style="font-size:11px">Atrasado</span>' : '') +
          (p.status === 'ENTREGUE' ? '<br><span class="muted" style="font-size:12.5px">Concluído ' + brData(p.entregue) + '</span>' : '') + '</td>' +
          cols.map(function (s) { return '<td>' + cellPcp((etBy[p.pid] || {})[s], p) + '</td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
  }
  h += tabela(abertos, 'Pedidos em aberto · situação em cada setor');
  if (!abertos.length) h += '<p class="muted" style="margin-top:14px">Nenhum pedido em aberto deste artigo.</p>';
  h += '<div class="legend" style="margin-top:8px"><span><i style="background:#EA580C"></i>Produzindo agora</span><span><i style="background:#FDF0D9;border:1px solid #D97706"></i>Pausado</span><span><i style="background:#16191A"></i>Concluído</span><span><i style="background:#ECEEEA"></i>Parcial</span><span><i style="border:1px dashed #9CA19C"></i>Aguardando</span></div>';

  var ss = d.sessoes;
  if (ss.length) {
    var porSetor = agrupa(ss, function (x) { return x.sec; }).sort(function (a, b) { return ordSec(a.k) - ordSec(b.k); });
    h += '<div class="cols" style="margin-top:16px"><div class="col"><h2>Tempo por setor (todo o histórico)</h2><table class="tbl"><thead><tr><th>Setor</th><th>Tempo</th><th>Peças</th><th>Média por peça</th></tr></thead><tbody>' +
      porSetor.map(function (g) {
        return '<tr><td><span class="legend" style="margin:0"><span><i style="background:' + corSec(g.k) + '"></i>' + esc(nm(g.k)) + '</span></span></td><td><b>' + dur(g.ms) + '</b></td><td class="mono">' + g.pecas + '</td><td class="mono">' + (g.pecas ? (g.ms / 60000 / g.pecas).toFixed(1).replace('.', ',') + ' min' : '–') + '</td></tr>';
      }).join('') + '</tbody></table><p class="muted" style="font-size:12.5px;margin:8px 0 0">Média = tempo cronometrado ÷ peças apontadas nas sessões do setor.</p></div>';
    var porFunc = agrupa(ss, function (x) { return x.func || 'Sem responsável'; });
    h += '<div class="col"><h2>Quem trabalhou neste artigo</h2><table class="tbl"><thead><tr><th>Funcionário</th><th>Tempo</th><th>Peças</th><th>Setores</th></tr></thead><tbody>' +
      porFunc.map(function (g) {
        var secs = {}; ss.forEach(function (x) { if ((x.func || 'Sem responsável') === g.k) secs[nm(x.sec)] = 1; });
        return '<tr><td>' + (g.x.fid && IX.func[g.x.fid] ? '<button class="btn ghost sm" style="min-height:38px" data-a="eq-open" data-f="' + esc(g.x.fid) + '">' + esc(g.k) + '</button>' : '<b>' + esc(g.k) + '</b>') + '</td><td><b>' + dur(g.ms) + '</b></td><td class="mono">' + g.pecas + '</td><td class="muted" style="font-size:13px">' + esc(Object.keys(secs).join(', ')) + '</td></tr>';
      }).join('') + '</tbody></table></div></div>';
    var ult = ss.slice().sort(function (a, b) { return b.ini - a.ini; }).slice(0, 40);
    h += '<details class="more-sec" open><summary>Histórico de trabalho (' + ss.length + ' registros)</summary><div class="scroll"><table class="tbl"><thead><tr><th>Quando</th><th>Duração</th><th>Setor</th><th>Pedido</th><th>Funcionário</th><th>Peças</th></tr></thead><tbody>' +
      ult.map(function (x) {
        var dd = new Date(x.ini - S.offset);
        return '<tr><td class="mono" style="white-space:nowrap">' + pad2(dd.getDate()) + '/' + pad2(dd.getMonth() + 1) + ' ' + hm(x.ini) + '–' + (x.fim ? hm(x.fim) : 'agora') + '</td><td><b>' + dur(fimS(x) - x.ini) + '</b></td>' +
          '<td>' + esc(nm(x.sec)) + '</td><td>' + esc(x.cli || '') + ' #' + esc(x.ped) + '</td><td>' + esc(x.func || '–') + '</td><td class="mono">' + x.pecas + '</td></tr>';
      }).join('') + '</tbody></table></div>' + (ss.length > 40 ? '<p class="muted" style="font-size:13px">Mostrando os 40 mais recentes.</p>' : '') + '</details>';
  } else {
    h += '<p class="muted" style="margin-top:16px">Ainda não há registros de trabalho cronometrado para este artigo.</p>';
  }
  return h;
}

function cellPcp(e, p) {
  if (!e) return '<div class="c-out">–</div>';
  var v = e.feitas + '/' + p.total;
  if (e.st === 'EXECUCAO') return '<div class="cell c-run"><span>● ' + esc(e.resp || 'produzindo') + '</span><span class="v">' + v + '</span>' + timerHtml(e, 'mono') + '</div>';
  if (e.st === 'CONCLUIDO') return '<div class="cell c-done"><span>Concluído ✓</span><span class="v">' + v + '</span><span>' + fmt(e.acc) + '</span></div>';
  if (e.st === 'PAUSADO') return '<div class="cell c-pause"><span>Pausado' + (e.resp ? ' · ' + esc(e.resp.split(' ')[0]) : '') + '</span><span class="v">' + v + '</span><span>' + fmt(e.acc) + '</span></div>';
  if (e.feitas > 0) return '<div class="cell c-part"><span>Parcial</span><span class="v">' + v + '</span></div>';
  return '<div class="cell c-none"><span>Aguardando</span><span class="v">' + v + '</span></div>';
}

/* =====================================================================
   Eventos
   ===================================================================== */
function ts() { return nowMs(); }
function msgFor(e, verbo) { var p = IX.ped[e.pid]; return cliName(p) + ' #' + p.ped + ' ' + verbo; }

document.addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-a]');
  if (!b || b.disabled || !ME) return;
  var a = b.getAttribute('data-a'), id = b.getAttribute('data-id');
  var e = id && S.data ? IX.et[id] : null;

  switch (a) {
    case 'sair': sair(); break;
    case 'minha-senha': trocarMinhaSenha(); break;
    case 'ms-salvar': salvarMinhaSenha(); break;
    case 'usr-perfil':
      var uf = S.usr.form = S.usr.form || { email: '', nome: '', perfis: ['producao'], ativo: true, editar: false, err: '' };
      var ue = document.getElementById('us-email'), un = document.getElementById('us-nome');
      if (ue) uf.email = ue.value; if (un) uf.nome = un.value;
      var pp = b.getAttribute('data-p'), ki = uf.perfis.indexOf(pp);
      if (ki >= 0) uf.perfis.splice(ki, 1); else uf.perfis.push(pp);
      uf.err = ''; render(); break;
    case 'usr-edit':
      var u = (S.usr.list || []).filter(function (x) { return x.id === id; })[0];
      if (u) { S.usr.form = { email: u.email || '', nome: u.nome, perfis: u.perfis.slice(), ativo: u.ativo, editar: true, err: '' }; render(); window.scrollTo(0, 0); }
      break;
    case 'usr-novo': S.usr.form = null; render(); break;
    case 'usr-salvar': salvarUsuario(); break;
    case 'reload': refresh(true); break;
    case 'tab': S.view = b.getAttribute('data-v'); S.conf = null; S.menu = null; S.ask = null; S.pick = null; if (S.view === 'equipe') S.eq.sel = null; if (S.view === 'usr') S.usr.list = null; applyPending(); render(); window.scrollTo(0, 0); break;
    case 'home': S.view = 'home'; S.conf = null; S.menu = null; S.ask = null; S.pick = null; applyPending(); render(); window.scrollTo(0, 0); break;
    case 'open-sec': S.view = 'sec'; S.sec = b.getAttribute('data-sec'); S.q = ''; S.filt = 'all'; S.open = {}; S.conf = null; S.menu = null; S.ask = null; render(); window.scrollTo(0, 0); break;

    case 'toggle':
      if (S.open[id]) { delete S.open[id]; if (S.conf && S.conf.id === id) S.conf = null; if (S.menu === id) S.menu = null; applyPending(); }
      else S.open[id] = true;
      redrawList(); break;
    case 'expand-all':
      var shown = shownItems();
      if (b.getAttribute('data-mode') === 'close') { S.open = {}; S.conf = null; S.menu = null; applyPending(); }
      else shown.forEach(function (x) { S.open[x.id] = true; });
      redrawList(); break;
    case 'filt': S.filt = b.getAttribute('data-f'); render(); break;

    case 'pick':
      if (!e) break;
      var fnp = b.getAttribute('data-fn');
      if (!ativos().length) { enqueue(fnp, [id, ts(), ''], msgFor(e, fnp === 'iniciar' ? 'iniciado' : 'retomado')); break; }
      S.pick = S.pick && S.pick.id === id ? null : { id: id, fn: fnp, all: false };
      S.conf = null; S.menu = null; render(); break;
    case 'pick-all': if (S.pick) { S.pick.all = true; render(); } break;
    case 'pick-cancel': S.pick = null; applyPending(); render(); break;
    case 'pick-go':
      if (!S.pick) break;
      var pe = IX.et[S.pick.id], fid = b.getAttribute('data-f'), fu = IX.func[fid];
      lsSet('nasaa_ult_' + pe.sec, fid);
      var pfn = S.pick.fn; S.pick = null;
      enqueue(pfn, [pe.id, ts(), fid], msgFor(pe, (pfn === 'iniciar' ? 'iniciado' : 'retomado') + ' por ' + (fu ? fu.nome : '')));
      break;
    case 'pause': if (e) enqueue('pausar', [id, ts()], msgFor(e, 'pausado')); break;

    case 'ff-new': S.eq.showForm = true; S.eq.form = { id: '', nome: '', sec: '', ativo: true, err: '' }; render(); focusEl('ff-nome'); break;
    case 'ff-edit':
      var fe = IX.func[b.getAttribute('data-f')];
      if (fe) { S.eq.showForm = true; S.eq.form = { id: fe.id, nome: fe.nome, sec: fe.sec, ativo: fe.ativo, err: '' }; render(); window.scrollTo(0, 0); focusEl('ff-nome'); }
      break;
    case 'ff-cancel': S.eq.showForm = false; S.eq.form = null; render(); break;
    case 'ff-save': salvarFuncionario(); break;
    case 'eq-open': S.view = 'equipe'; S.eq.sel = b.getAttribute('data-f'); S.eq.tab = 'dia'; S.eq.date = hoje(); S.eq.dia = null; S.eq.hist = null; render(); window.scrollTo(0, 0); break;
    case 'eq-back': S.eq.sel = null; render(); break;
    case 'eq-tab': S.eq.tab = b.getAttribute('data-t'); render(); break;
    case 'eq-dias': S.eq.dias = +b.getAttribute('data-n'); S.eq.hist = null; render(); break;
    case 'eq-day':
      var dd = new Date((S.eq.date || hoje()) + 'T12:00:00'); dd.setDate(dd.getDate() + (+b.getAttribute('data-d')));
      S.eq.date = dstr(dd); S.eq.dia = null; render(); break;
    case 'eq-goday': S.eq.tab = 'dia'; S.eq.date = b.getAttribute('data-d'); S.eq.dia = null; render(); window.scrollTo(0, 0); break;
    case 'pcp-go':
      S.view = 'pcp'; S.pcp.cod = b.getAttribute('data-cod'); S.pcp.q = S.pcp.cod; S.pcp.data = null;
      fetchTo('getArtigo', S.pcp.cod, S.pcp, 'data'); window.scrollTo(0, 0); break;
    case 'pcp-refresh': fetchTo('getArtigo', S.pcp.cod, S.pcp, 'data'); break;
    case 'report': S.open[id] = true; S.conf = { id: id, mode: 'report', qty: '', err: '' }; S.menu = null; render(); focusEl('cq'); break;
    case 'finish': S.open[id] = true; S.conf = { id: id, mode: 'final', qty: e ? String(falta(e)) : '', err: '' }; S.menu = null; render(); focusEl('cq'); break;
    case 'conf-cancel': S.conf = null; applyPending(); render(); break;
    case 'conf-ok': confirmQty(); break;
    case 'menu': S.menu = S.menu === id ? null : id; S.conf = null; if (!S.menu) applyPending(); render(); break;
    case 'add-sec':
      var pid = b.getAttribute('data-pid'), sec = b.getAttribute('data-sec');
      S.menu = null;
      enqueue('incluirSetor', [pid, sec, uid(), ts()], nm(sec) + ' incluído no pedido #' + IX.ped[pid].ped);
      break;

    case 'ask-all': S.ask = 'all'; render(); break;
    case 'ask-sec': S.ask = S.sec; render(); break;
    case 'ask-cancel': S.ask = null; applyPending(); render(); break;
    case 'ask-ok':
      var scope = S.ask === 'all' ? '' : S.ask;
      var n = S.data.etapas.filter(function (x) { return x.st === 'EXECUCAO' && (!scope || x.sec === scope); }).length;
      S.ask = null;
      enqueue('pausarTodos', [scope, ts()], plural(n, 'pedido pausado', 'pedidos pausados') + (scope ? ' em ' + nm(scope) : ' em todos os setores'));
      break;

    case 'np-create': criarPedido(); break;

    case 'fa-toggle':
      var s = b.getAttribute('data-sec'), r = S.fa.rota, k = r.indexOf(s);
      if (k >= 0) r.splice(k, 1); else r.push(s);
      S.fa.err = ''; render(); break;
    case 'fa-up': moveRota(+b.getAttribute('data-i'), -1); break;
    case 'fa-down': moveRota(+b.getAttribute('data-i'), 1); break;
    case 'fa-rm': S.fa.rota.splice(+b.getAttribute('data-i'), 1); render(); break;
    case 'fa-edit':
      var art = IX.art[b.getAttribute('data-cod')];
      if (art) { S.fa = { cod: art.cod, cli: art.cli, desc: art.desc, tempo: art.tempo, rota: art.rota.slice(), err: '', editar: true, filtro: S.fa.filtro }; render(); window.scrollTo(0, 0); }
      break;
    case 'fa-new': S.fa = { cod: '', cli: S.data.clientes[0] || '', desc: '', tempo: '', rota: [], err: '', editar: false, filtro: S.fa.filtro }; render(); break;
    case 'fa-save': salvarArtigo(); break;
  }
});

function redrawList() {
  var el = document.getElementById('slist');
  if (el) el.innerHTML = secList(); else render();
}

document.addEventListener('input', function (ev) {
  if (!ME) return;
  var t = ev.target, v = t.value;
  switch (t.id) {
    case 'q': S.q = v; redrawList(); break;
    case 'cq': if (S.conf) { S.conf.qty = v; S.conf.err = ''; } break;
    case 'np-art': S.np.art = v; S.np.cli = IX.art[v] ? IX.art[v].cli : ''; S.np.err = ''; render(); break;
    case 'np-cli': S.np.cli = v; break;
    case 'np-ped': S.np.ped = v; S.np.err = ''; break;
    case 'np-qtd': S.np.qtd = v; S.np.err = ''; break;
    case 'np-prazo': S.np.prazo = v; S.np.err = ''; break;
    case 'fa-cod': S.fa.cod = v; S.fa.err = ''; break;
    case 'fa-cli': S.fa.cli = v; break;
    case 'fa-desc': S.fa.desc = v; break;
    case 'fa-tempo': S.fa.tempo = v; break;
    case 'fa-filtro': S.fa.filtro = v; document.getElementById('alist').innerHTML = artList(); break;
    case 'ff-nome': if (S.eq.form) { S.eq.form.nome = v; S.eq.form.err = ''; } break;
    case 'ff-sec': if (S.eq.form) S.eq.form.sec = v; break;
    case 'ff-ativo': if (S.eq.form) S.eq.form.ativo = t.checked; break;
    case 'eq-date': if (v) { S.eq.date = v; S.eq.dia = null; render(); } break;
    case 'pcp-q': S.pcp.q = v; document.getElementById('pcp-sugg').innerHTML = pcpSugg(); break;
  }
});

document.addEventListener('change', function (ev) {
  if (ev.target.id === 'ff-ativo' && S.eq.form) S.eq.form.ativo = ev.target.checked;
});

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && ev.target.id === 'cq') { ev.preventDefault(); confirmQty(); }
  if (ev.key === 'Enter' && ev.target.id === 'ff-nome') { ev.preventDefault(); salvarFuncionario(); }
});

function focusEl(id) { setTimeout(function () { var el = document.getElementById(id); if (el) { el.focus(); if (el.select) el.select(); } }, 30); }

function confirmQty() {
  var c = S.conf; if (!c) return;
  var e = IX.et[c.id];
  if (!e) { S.conf = null; render(); return; }
  var raw = String(c.qty).trim(), v = Math.round(Number(raw));
  var fin = c.mode === 'final';
  if (raw === '' || isNaN(v) || v < 0 || (!fin && v < 1)) { c.err = 'Informe a quantidade de peças.'; render(); focusEl('cq'); return; }
  if (v > falta(e)) { c.err = 'Faltam só ' + falta(e) + ' peças deste pedido neste setor.'; render(); focusEl('cq'); return; }
  var p = IX.ped[e.pid], total = e.feitas + v;
  S.conf = null;
  if (fin || total >= p.total) delete S.open[c.id];
  enqueue(fin ? 'finalizar' : 'apontar', [c.id, v, ts()],
    nm(e.sec) + ': ' + total + ' de ' + p.total + ' pç' + (fin || total >= p.total ? ' · setor concluído' : ''));
}

function criarPedido() {
  var f = S.np, a = IX.art[f.art];
  if (!a) { f.err = 'Escolha um artigo.'; render(); return; }
  if (!a.rota.length) { f.err = 'Este artigo não tem rota. Defina em Artigos e rotas.'; render(); return; }
  if (!f.ped.trim()) { f.err = 'Informe o número do pedido.'; render(); focusEl('np-ped'); return; }
  if (!(Math.round(Number(f.qtd)) >= 1)) { f.err = 'Informe a quantidade.'; render(); focusEl('np-qtd'); return; }
  if (!f.prazo) { f.err = 'Informe a data de entrega.'; render(); focusEl('np-prazo'); return; }
  direct('criarPedido', { cod: f.art, cli: f.cli || a.cli, ped: f.ped.trim(), qtd: Math.round(Number(f.qtd)), prazo: f.prazo }).then(function (ok) {
    if (ok) { S.np.ped = ''; S.np.qtd = ''; S.np.prazo = ''; render(); }
  });
}

function salvarArtigo() {
  var f = S.fa;
  if (!f.cod.trim()) { f.err = 'Informe o código do artigo.'; render(); focusEl('fa-cod'); return; }
  if (!f.rota.length) { f.err = 'Escolha pelo menos um setor para a rota.'; render(); return; }
  direct('salvarArtigo', { cod: f.cod.trim(), cli: String(f.cli || '').trim(), desc: f.desc.trim(), tempo: String(f.tempo == null ? '' : f.tempo).trim(), rota: f.rota.slice(), editar: f.editar }).then(function (ok) {
    if (ok) { S.fa = { cod: '', cli: S.data.clientes[0] || '', desc: '', tempo: '', rota: [], err: '', editar: false, filtro: S.fa.filtro }; render(); }
  });
}

function salvarFuncionario() {
  var f = S.eq.form; if (!f) return;
  if (!f.nome.trim()) { f.err = 'Informe o nome.'; render(); focusEl('ff-nome'); return; }
  direct('salvarFuncionario', { id: f.id, nome: f.nome.trim(), setor: f.sec, ativo: f.ativo }).then(function (ok) {
    if (ok) { S.eq.showForm = false; S.eq.form = null; render(); }
  });
}

function moveRota(i, d) {
  var r = S.fa.rota, j = i + d;
  if (j < 0 || j >= r.length) return;
  var t = r[i]; r[i] = r[j]; r[j] = t;
  render();
}

/* =====================================================================
   Início: depois do login, mostra a última cópia salva no aparelho e atualiza
   ===================================================================== */
function start() {
  var snap = lsGet('nasaa_dados', null);
  if (snap && snap.data) {
    S.data = snap.data; S.offset = snap.offset || 0;
    index();
    initDefaults();
    Q.forEach(applyLocal);
  }
  render();
  if (!S.data) document.getElementById('app').innerHTML = '<div class="loading">Carregando produção…</div>';
  pump();
  refresh(!snap);
  setInterval(function () { if (!document.hidden && !S.sending) refresh(false); }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { refresh(false); pump(); } });
  window.addEventListener('online', function () { backoff = 0; pump(); refresh(false); });
}

iniciar();
</script>
