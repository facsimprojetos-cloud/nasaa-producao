<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16191A">
<title>NASAA · Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js?v=202611171600"></script>
<style>
:root{
  --bg:#F3F4F1;--ink:#16191A;--mut:#545B5E;--line:#D9DCD6;--soft:#ECEEEA;
  --or:#C2410C;--or-bg:#FFF1E8;--or-ink:#9A3412;
  --bl:#1D4ED8;--bl-bg:#E3EAFD;--bl-ink:#1E3A8A;
  --am:#D97706;--am-bg:#FDF0D9;--am-ink:#8A4B08;
  --rd-bg:#FCE4E2;--rd-ink:#9F1D18;
  --pu-bg:#F7F2FE;--pu-line:#D9C8F5;--pu-ink:#3B1A78;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:16px;line-height:1.4}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:progress}
:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono)}
.muted{color:var(--mut)}

.top{background:var(--ink);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:12px 20px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-weight:800;font-size:22px;letter-spacing:.06em}
.brand span{color:#C9CDC8;font-size:15px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#C9CDC8;padding:4px 10px;border-radius:999px;border:1px solid #3A4043}
.sync .d{width:8px;height:8px;border-radius:50%;background:#86EFAC}
.sync.busy .d{background:#93B0F5}
.sync.off{color:#FDE68A;border-color:#8A6A1A}
.sync.off .d{background:#FBBF24}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.tab{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #5B6265;background:transparent;color:#fff;font-weight:600;font-size:15px}
.tab.on{background:#fff;color:var(--ink);border-color:#fff;font-weight:700}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9CDC8}
.me button{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #5B6265;background:transparent;color:#fff;font-weight:600;font-size:13px}

main{max-width:1240px;margin:0 auto;padding:22px 16px 80px}
h1{margin:0;font-size:30px;font-weight:800;line-height:1.15}
h2{margin:0 0 10px;font-size:18px;font-weight:800}
.sub{margin:6px 0 0;color:var(--mut);font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center}
.between{justify-content:space-between}
.mb{margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 16px}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:600}
.stat .l{font-size:13px;color:var(--mut)}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.grow{flex:1 1 240px;min-width:0}

/* Tela inicial: cards de setor */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:180px;display:flex;flex-direction:column;gap:10px}
.scard:hover{border-color:#9CA19C}
.scard .ord{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--mut)}
.scard .nm{font-size:22px;font-weight:800;line-height:1.15}
.scard .big{font-family:var(--mono);font-size:30px;font-weight:600}
.scard .foot{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--soft);font-size:14px;font-weight:600}
.run-t{display:inline-flex;align-items:center;gap:6px;color:var(--bl-ink)}
.pau-t{display:inline-flex;align-items:center;gap:6px;color:var(--am-ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bl);display:inline-block;flex:none}
.sq{width:9px;height:9px;border-radius:2px;background:var(--am);display:inline-block;flex:none}

/* Botões */
.btn{min-height:56px;padding:0 20px;border-radius:12px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;background:#fff;white-space:nowrap}
.btn svg{flex:none}
.pri{background:var(--or);color:#fff;font-weight:800}
.dark{background:var(--ink);color:#fff}
.out{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.soft{background:var(--or-bg);color:var(--or-ink);border:2px solid var(--or)}
.ghost{background:#fff;color:var(--ink);border:1px solid #9CA19C;font-weight:600}
.sm{min-height:44px;font-size:15px;padding:0 14px;border-radius:10px}
.md{min-height:48px;font-size:16px;padding:0 16px;border-radius:10px}
.wide{width:100%}
.back{min-height:44px;padding:0 14px 0 8px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.p-fila{background:var(--soft);color:#3F4548}
.p-run{background:var(--bl-bg);color:var(--bl-ink)}
.p-pause{background:var(--am-bg);color:var(--am-ink)}
.p-late{background:var(--rd-bg);color:var(--rd-ink)}
.p-extra{background:#F1E8FD;color:#5B21B6}
.p-done{background:var(--ink);color:#fff}

/* Barra de ferramentas do setor */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tools input{flex:1 1 300px;min-width:0;height:50px;border:1.5px solid #9CA19C;border-radius:12px;padding:0 16px;font-size:17px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #9CA19C;background:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip .n{font-family:var(--mono);font-size:14px;color:var(--mut)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .n{color:#C9CDC8}

/* Card compacto */
.olist{display:flex;flex-direction:column;gap:8px}
.mcard{background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px 8px 8px}
.mcard.isrun{border-color:#93B0F5}
.mtog{flex:1 1 520px;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:none;border:none;text-align:left;padding:6px 8px;border-radius:10px}
.mtog:hover{background:var(--bg)}
.mid{display:flex;flex-direction:column;gap:2px;min-width:170px;flex:1 1 200px}
.mcli{font-size:17px;font-weight:800;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.mcli .pn{font-size:14px;font-weight:600;color:var(--mut)}
.mmeta{font-size:13px;color:var(--mut)}
.lt{color:var(--rd-ink);font-weight:700}
.mbar{display:flex;flex-direction:column;gap:5px;flex:1 1 200px;min-width:160px;max-width:300px}
.segs{display:flex;gap:3px}
.seg{flex:1;height:10px;border-radius:3px;background:var(--soft);overflow:hidden;position:relative;border:1px solid transparent}
.seg>span{display:block;height:100%;background:#6B7275}
.seg.full>span{background:var(--ink)}
.seg.cur{border-color:var(--or);background:var(--or-bg)}
.seg.cur>span{background:var(--or)}
.mq{flex:0 0 auto;min-width:96px;display:flex;flex-direction:column}
.mq b{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.1}
.mst{flex:0 0 auto;min-width:128px;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.tsm{font-family:var(--mono);font-size:18px;font-weight:600}
.mact{flex:0 0 auto;display:flex;gap:8px;align-items:center;margin-left:auto}
.chev{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}

/* Card expandido */
.ocard{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:16px 18px}
.ocard.isrun{border-color:var(--bl)}
.otop{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px}
.oinfo{flex:1 1 240px;min-width:0}
.oinfo .cli{font-size:21px;font-weight:800}
.oqty{flex:0 0 auto;min-width:120px}
.oqty .n{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1}
.ostat{flex:0 0 auto;min-width:150px}
.timer{font-family:var(--mono);font-size:26px;font-weight:600;margin-top:6px}
.t-AGUARDANDO{color:#8A9093}.t-EXECUCAO{color:var(--bl)}.t-PAUSADO{color:var(--am-ink)}
.oact{flex:0 1 auto;display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-left:auto}
.oprog{margin-top:14px;padding-top:12px;border-top:1px solid var(--soft)}
.more{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.ohead{display:flex;justify-content:flex-end;margin:-6px -8px 4px 0}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;flex-direction:column;gap:2px;min-width:100px;padding:7px 11px;border-radius:10px;font-size:13px;font-weight:700}
.step .v{font-family:var(--mono);font-size:15px;font-weight:600}
.s-cur{border:2px solid var(--or);background:var(--or-bg);color:var(--or-ink)}
.s-full{background:var(--ink);color:#fff;border:1px solid var(--ink)}
.s-part{background:var(--soft);border:1px solid #B9BEB7}
.s-none{background:#fff;border:1px dashed #9CA19C;color:var(--mut);font-weight:600}

.panel{margin-top:14px;padding:14px;background:var(--bg);border-radius:12px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px}
.panel.pu{background:var(--pu-bg);border:1px solid var(--pu-line);color:var(--pu-ink);display:block}
.panel input{width:160px;height:52px;border:2px solid var(--ink);border-radius:10px;padding:0 12px;font-family:var(--mono);font-size:22px;font-weight:600;background:#fff}
.addsec{min-height:46px;padding:0 14px;border-radius:10px;border:1.5px solid #7C5CC4;background:#fff;color:var(--pu-ink);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.err{color:var(--rd-ink);font-weight:700;font-size:14px;width:100%}

.list{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.list>div{padding:10px 16px;border-bottom:1px solid var(--soft);display:flex;flex-wrap:wrap;align-items:center;gap:4px 16px;font-size:15px}
.list>div:last-child{border-bottom:none}
.empty{background:#fff;border:1px dashed #B9BEB7;border-radius:16px;padding:36px 20px;text-align:center}
details.more-sec{margin-top:28px}
details.more-sec summary{cursor:pointer;font-size:18px;font-weight:800;min-height:44px;display:flex;align-items:center}

/* Formulários */
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{flex:1 1 420px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.in{height:48px;border:1.5px solid #9CA19C;border-radius:10px;padding:0 12px;font-size:16px;background:#fff;width:100%;font-weight:400}
.chipsel{min-height:46px;padding:0 14px;border-radius:10px;border:1.5px solid #9CA19C;background:#fff;font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chipsel.on{border:2px solid var(--or);background:var(--or-bg);color:var(--or-ink);font-weight:700}
.chipsel .k{font-family:var(--mono);background:var(--or);color:#fff;border-radius:6px;padding:1px 7px;font-size:13px}
.rline{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 12px}
.ib{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center}
.tag{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700}
.tag .k{font-family:var(--mono);color:var(--or-ink)}
.alist>div{padding:12px 0;border-bottom:1px solid var(--soft)}

.s-run{background:#EA580C;color:#fff;border:2px solid #EA580C;animation:pulse 1.6s infinite}
.s-run .who{font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1.1s infinite;flex:none}
.seg.run{border-color:#EA580C;background:#FED7AA;animation:pulse 1.6s infinite}
.seg.run>span{background:#EA580C}
.prodnow{font-size:12.5px;font-weight:700;color:#C2410C;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.prodnow .live-dot{background:#EA580C}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(234,88,12,.55)}50%{box-shadow:0 0 0 5px rgba(234,88,12,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion: reduce){.s-run,.seg.run,.live-dot{animation:none}}
.resp{font-size:13px;font-weight:700;color:var(--ink);display:inline-flex;gap:5px;align-items:center}
.pick{flex-basis:100%;background:var(--or-bg);border:1px solid #F2B48F;border-radius:12px;padding:12px 14px;margin-top:6px}
.pick .names{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pname{min-height:52px;padding:0 18px;border-radius:12px;border:1.5px solid var(--or);background:#fff;font-size:17px;font-weight:700}
.pname.last{background:var(--or);color:#fff}
.pname.oth{border-color:#9CA19C;font-weight:600}
/* Equipe e PCP */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fcard{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:150px}
.fcard.on{border:2px solid #EA580C}
.fcard .fn{font-size:18px;font-weight:800}
.fcard .fs{font-size:13px;color:var(--mut)}
.job{background:#FFF7ED;border-radius:10px;padding:8px 10px;font-size:13.5px}
.job b{font-weight:800}
.tl{position:relative;height:64px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:10px 0 4px;overflow:hidden}
.tl .blk{position:absolute;top:10px;height:44px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:4px 6px;overflow:hidden;white-space:nowrap;line-height:1.25}
.tl .blk.open{outline:2px dashed #fff;outline-offset:-4px}
.tl .hr{position:absolute;top:0;bottom:0;border-left:1px dashed #E3E5E0}
.tlx{position:relative;height:18px;font-size:11px;color:var(--mut)}
.tlx span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;margin:6px 0 4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);background:#FAFAF8;white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--soft);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .gap td{background:#FAFAF8;color:var(--mut);font-size:13px}
.scroll{overflow-x:auto;border-radius:12px}
.cell{display:flex;flex-direction:column;gap:2px;min-width:96px;padding:6px 8px;border-radius:8px;font-size:12px;font-weight:700}
.cell .v{font-family:var(--mono);font-size:14px}
.c-done{background:var(--ink);color:#fff}
.c-part{background:var(--soft)}
.c-pause{background:var(--am-bg);color:var(--am-ink)}
.c-none{border:1px dashed #9CA19C;color:var(--mut);font-weight:600}
.c-run{background:#EA580C;color:#fff;animation:pulse 1.6s infinite}
.c-run [data-t],.s-run [data-t]{color:#fff}
.c-out{color:#B9BEB7;text-align:center}
.bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;min-width:80px}
.bar>span{display:block;height:100%;background:var(--ink)}
.seg-tabs{display:inline-flex;border:1px solid #9CA19C;border-radius:12px;overflow:hidden}
.seg-tabs button{min-height:44px;padding:0 16px;border:none;background:#fff;font-weight:600;font-size:15px}
.seg-tabs button.on{background:var(--ink);color:#fff}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:14px 18px;font-weight:600;max-width:min(92vw,640px);z-index:20;display:none;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast.err{background:var(--rd-ink)}
.loading{padding:80px 0;text-align:center;color:var(--mut);font-size:18px}
.foot-sync{font-size:12px;color:#7A8083;margin-top:18px}
/* Login */
.login{max-width:440px;margin:40px auto 0}
.login .col{display:flex;flex-direction:column;gap:14px}
.login h1{font-size:26px}
.okbox{background:#E7F6EC;color:#14532D;border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px}
.errbox{background:var(--rd-bg);color:var(--rd-ink);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px}
.avbox{background:var(--am-bg);color:var(--am-ink);border-radius:10px;padding:12px 14px;font-weight:600;font-size:15px}
.linkbtn{background:none;border:none;color:var(--bl-ink);font-weight:600;text-decoration:underline;padding:6px 0;min-height:40px}
@media (max-width:640px){
  .top{position:static}
  .form{grid-template-columns:minmax(0,1fr)}
  .oact{margin-left:0;justify-content:flex-start}
  .mtog{flex-basis:100%}
  .mact{margin-left:auto}
  h1{font-size:26px}
}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="app"><div class="loading">Carregando produção…</div></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* =====================================================================
   Estado
   ===================================================================== */
var S = {
  data: null, offset: 0, view: 'home', sec: null, q: '', filt: 'all', open: {},
  conf: null, menu: null, ask: null, busy: false, pending: null, lastSync: null,
  sending: false, netErr: false, refreshing: false,
  pick: null,
  eq: { sel: null, tab: 'dia', date: '', dias: 7, dia: null, hist: null, loading: false, form: null, showForm: false },
  pcp: { q: '', cod: '', data: null, loading: false },
  np: { art: '', cli: '', ped: '', qtd: '', prazo: '', err: '' },
  fa: { cod: '', cli: '', desc: '', tempo: '', rota: [], err: '', editar: false, filtro: '' },
  usr: { list: null, loading: false, form: null }
};
var IX = { ped: {}, sec: {}, art: {}, etByPid: {}, et: {}, func: {} };
var Q = lsGet('nasaa_fila', []);        // ações ainda não confirmadas pelo servidor

function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* =====================================================================
   Utilitários
   ===================================================================== */
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function nowMs() { return Date.now() + S.offset; }
function fmt(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  function p(v) { return (v < 10 ? '0' : '') + v; }
  return p(Math.floor(s / 3600)) + ':' + p(Math.floor((s % 3600) / 60)) + ':' + p(s % 60);
}
function elapsed(e) { return e.acc + (e.st === 'EXECUCAO' && e.t0 ? nowMs() - e.t0 : 0); }
function nm(id) { return IX.sec[id] ? IX.sec[id].nome : id; }
function ordSec(id) { return S.data.setores.findIndex(function (s) { return s.id === id; }); }
function ord(id) { var i = ordSec(id); return (i < 9 ? '0' : '') + (i + 1); }
function br(d) { if (!d || d.length < 10) return d || 'sem prazo'; return d.slice(8, 10) + '/' + d.slice(5, 7); }
function isLate(p) { return !!p.prazo && p.prazo < S.data.today; }
function etapa(pid, sec) { return (IX.etByPid[pid] || []).filter(function (e) { return e.sec === sec; })[0]; }
function feitas(pid, sec) { var e = etapa(pid, sec); return e ? e.feitas : 0; }
function falta(e) { return IX.ped[e.pid].total - e.feitas; }
function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
function lastDone(p) { return p.rota.length ? feitas(p.pid, p.rota[p.rota.length - 1]) : 0; }
function uid() {
  try { var a = new Uint8Array(5); crypto.getRandomValues(a); return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
  catch (e) { return (Math.random().toString(16) + '0000000000').slice(2, 12); }
}
function hhmm() { var d = new Date(); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function cliName(p) { return p.cli || 'Sem cliente'; }

  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',

};

/* =====================================================================
   Servidor (Supabase) e login
   ===================================================================== */
var CFG = window.NASAA_CFG;
var sb = window.supabase.createClient(CFG.url, CFG.key, {
  db: { schema: CFG.schema },
  auth: { persistSession: true, autoRefreshToken: true }
});
var ME = null;                      // { id, nome, email, perfis }
var recuperandoSenha = /type=recovery/.test(location.hash);
function tem(p) { return !!ME && (ME.perfis.indexOf('admin') >= 0 || ME.perfis.indexOf(p) >= 0); }

// Nome antigo (Apps Script) → função do banco e parâmetros
var RPC = {
  getData: function (a) { return ['dados', { p_ver: a[0] == null ? null : String(a[0]) }]; },
  sync: function (a) { return ['sync', { ops: a[0] }]; },
  criarPedido: function (a) { return ['criar_pedido', { o: a[0] }]; },
  salvarArtigo: function (a) { return ['salvar_artigo', { o: a[0] }]; },
  salvarFuncionario: function (a) { return ['salvar_funcionario', { o: a[0] }]; },
  getSessoes: function (a) { return ['sessoes_filtro', { f: a[0] || {} }]; },
  getArtigo: function (a) { return ['artigo', { p_cod: a[0] }]; }
};

function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var m = RPC[fn](args);
  return sb.rpc(m[0], m[1]).then(function (r) {
    if (r.error) {
      var msg = r.error.message || '';
      if (/JWT|not authenticated|Acesso negado\.$/i.test(msg)) { sessaoPerdida(); }
      var err = new Error(msg); err.sb = r.error; throw err;
    }
    return r.data;
  });
}

function sessaoPerdida() {
  sb.auth.getSession().then(function (r) { if (!r.data.session) telaLogin('Sua sessão terminou. Entre de novo.'); });
}

function traduzErroAuth(m) {
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou senha incorretos.';
  if (/Email not confirmed/i.test(m)) return 'Confirme seu e-mail pelo link recebido antes de entrar.';
  if (/already registered/i.test(m)) return 'Este e-mail já tem conta. Use "Entrar".';
  if (/Password should be/i.test(m)) return 'A senha precisa ter pelo menos 6 caracteres.';
  if (/should be different/i.test(m)) return 'A nova senha precisa ser diferente da atual.';
  if (/rate limit|security purposes/i.test(m)) return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
  if (/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão com a internet.';
  return m;
}

function topSimples() {
  document.getElementById('top').innerHTML = '<div class="brand"><b>NASAA</b><span>Controle de produção</span></div>';
}

function telaLogin(msg, ok) {
  ME = null;
  topSimples();
  document.getElementById('app').innerHTML =
    '<div class="login"><div class="col"><h1>Entrar</h1>' +
    (msg ? '<div class="' + (ok ? 'okbox' : 'errbox') + '" role="alert">' + esc(msg) + '</div>' : '') +
    '<form id="f-login" class="login-form" style="display:flex;flex-direction:column;gap:14px">' +
    '<label class="f" for="lg-email">E-mail<input class="in" id="lg-email" name="email" type="email" required autocomplete="username"></label>' +
    '<label class="f" for="lg-senha">Senha<input class="in" id="lg-senha" name="senha" type="password" required minlength="6" autocomplete="current-password"></label>' +
    '<button class="btn pri wide" type="submit">Entrar</button>' +
    '<button class="btn ghost wide md" type="button" id="lg-criar">Criar conta</button>' +
    '<button class="linkbtn" type="button" id="lg-esqueci">Esqueci minha senha</button></form>' +
    '<p class="muted" style="font-size:13px;margin:0">Primeiro acesso de um funcionário ou tablet: digite o e-mail e uma senha e toque em <b>Criar conta</b>. Depois o administrador libera o acesso em <b>Usuários</b>.</p>' +
    '</div></div>';
  var f = document.getElementById('f-login');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var email = f.email.value.trim(), senha = f.senha.value;
    var b = f.querySelector('[type=submit]'); b.disabled = true; b.textContent = 'Entrando…';
    sb.auth.signInWithPassword({ email: email, password: senha }).then(function (r) {
      if (r.error) return telaLogin(traduzErroAuth(r.error.message));
      iniciar();
    });
  });
  document.getElementById('lg-criar').onclick = function () {
    var email = f.email.value.trim(), senha = f.senha.value;
    if (!email || senha.length < 6) return telaLogin('Para criar a conta, preencha o e-mail e uma senha de pelo menos 6 caracteres.');
    sb.auth.signUp({ email: email, password: senha, options: { emailRedirectTo: location.origin + location.pathname } }).then(function (r) {
      if (r.error) return telaLogin(traduzErroAuth(r.error.message));
      if (!r.data.session) telaLogin('Conta criada. Confirme pelo link enviado ao seu e-mail e depois entre.', true);
      else iniciar();
    });
  };
  document.getElementById('lg-esqueci').onclick = function () {
    var email = f.email.value.trim();
    if (!email) return telaLogin('Digite seu e-mail para receber o link de nova senha.');
    sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(function (r) {
      telaLogin(r.error ? traduzErroAuth(r.error.message) : 'Se o e-mail estiver cadastrado, enviamos um link para criar uma nova senha. Veja também a caixa de spam.', !r.error);
    });
  };
  setTimeout(function () { var el = document.getElementById('lg-email'); if (el) el.focus(); }, 30);
}

function telaNovaSenha(msg) {
  topSimples();
  document.getElementById('app').innerHTML =
    '<div class="login"><div class="col"><h1>Criar nova senha</h1>' +
    (msg ? '<div class="errbox" role="alert">' + esc(msg) + '</div>' : '') +
    '<form id="f-nova" style="display:flex;flex-direction:column;gap:14px">' +
    '<label class="f" for="ns-1">Nova senha<input class="in" id="ns-1" name="nova" type="password" required minlength="6" autocomplete="new-password"></label>' +
    '<label class="f" for="ns-2">Repita a nova senha<input class="in" id="ns-2" name="repete" type="password" required minlength="6" autocomplete="new-password"></label>' +
    '<button class="btn pri wide" type="submit">Salvar nova senha</button></form></div></div>';
  var f = document.getElementById('f-nova');
  f.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (f.nova.value.length < 6) return telaNovaSenha('A senha precisa ter pelo menos 6 caracteres.');
    if (f.nova.value !== f.repete.value) return telaNovaSenha('As duas senhas não são iguais.');
    sb.auth.updateUser({ password: f.nova.value }).then(function (r) {
      if (r.error) return telaNovaSenha(traduzErroAuth(r.error.message));
      recuperandoSenha = false;
      history.replaceState(null, '', location.pathname);
      toast('Senha alterada.');
      iniciar();
    });
  });
}

function telaSemAcesso(eu, email) {
  topSimples();
  var semAdmin = eu && eu.sem_admin;
  document.getElementById('app').innerHTML =
    '<div class="login"><div class="col"><h1>NASAA</h1><div class="muted">' + esc(email) + '</div>' +
    (semAdmin
      ? '<div class="avbox">Nenhum administrador configurado ainda. Como primeiro acesso, você pode se tornar o administrador.</div>' +
        '<form id="f-boot" style="display:flex;flex-direction:column;gap:14px"><label class="f" for="bt-nome">Seu nome<input class="in" id="bt-nome" name="nome" required></label>' +
        '<button class="btn pri wide" type="submit">Tornar-me administrador</button></form>'
      : '<div class="avbox">Sua conta foi criada, mas ainda não foi liberada para o NASAA. Peça ao administrador para liberar seu acesso em <b>Usuários</b>.</div>') +
    '<button class="btn ghost wide md" id="sa-sair">Sair</button></div></div>';
  document.getElementById('sa-sair').onclick = sair;
  var fb = document.getElementById('f-boot');
  if (fb) fb.addEventListener('submit', function (ev) {
    ev.preventDefault();
    sb.rpc('bootstrap_admin', { p_nome: fb.nome.value.trim() }).then(function (r) {
      if (r.error) return toast(r.error.message, true);
      iniciar();
    });
  });
}

function sair() {
  sb.auth.signOut().then(function () {
    try { localStorage.removeItem('nasaa_dados'); } catch (e) {}
    location.hash = ''; location.reload();
  });
}

function trocarMinhaSenha() {
  S.view = 'senha'; render();
}

var iniciando = false, iniciado = false;
function iniciar() {
  if (iniciando) return;
  iniciando = true;
  sb.auth.getSession().then(function (r) {
    var session = r.data.session;
    if (!session) { iniciando = false; return telaLogin(); }
    if (recuperandoSenha) { iniciando = false; return telaNovaSenha(); }
    return sb.rpc('eu').then(function (x) {
      iniciando = false;
      if (x.error) {
        var m = /schema must be one of|Invalid schema/i.test(x.error.message)
          ? 'O esquema "nasaa" ainda não foi liberado na API do Supabase (Settings → Data API → Exposed schemas).'
          : traduzErroAuth(x.error.message);
        topSimples();
        document.getElementById('app').innerHTML = '<div class="login"><div class="col"><div class="errbox">' + esc(m) + '</div><button class="btn ghost wide md" onclick="location.reload()">Tentar de novo</button><button class="btn ghost wide md" id="er-sair">Sair</button></div></div>';
        document.getElementById('er-sair').onclick = sair;
        return;
      }
      var eu = x.data || {};
      if (!eu.perfis || !eu.perfis.length || !eu.nome) return telaSemAcesso(eu, session.user.email);
      ME = { id: eu.id, nome: eu.nome, email: eu.email || session.user.email, perfis: eu.perfis };
      if (!iniciado) { iniciado = true; start(); } else { render(); refresh(true); }
    });
  }).catch(function () {
    iniciando = false;
    topSimples();
    document.getElementById('app').innerHTML = '<div class="empty"><h2>Sem conexão</h2><p class="muted">Verifique a internet e tente de novo.</p><button class="btn pri" onclick="location.reload()">Tentar de novo</button></div>';
  });
}

sb.auth.onAuthStateChange(function (evento) {
  if (evento === 'PASSWORD_RECOVERY') { recuperandoSenha = true; telaNovaSenha(); }
});

/* =====================================================================
   Dados: índice, cópia local e servidor
   ===================================================================== */
function index() {
  var d = S.data;
  IX = { ped: {}, sec: {}, art: {}, etByPid: {}, et: {}, func: {} };
  (d.funcionarios = d.funcionarios || []).forEach(function (f) { IX.func[f.id] = f; });
  d.pedidos.forEach(function (p) { IX.ped[p.pid] = p; });
  d.setores.forEach(function (s) { IX.sec[s.id] = s; });
  d.artigos.forEach(function (a) { IX.art[a.cod] = a; });
  d.etapas.forEach(function (e) { IX.et[e.id] = e; (IX.etByPid[e.pid] = IX.etByPid[e.pid] || []).push(e); });
}

/** Recebe dados novos do servidor (só quando não há ações pendentes). */
function setData(d) {
  S.data = d;
  S.offset = d.now - Date.now();
  S.lastSync = new Date();
  S.pending = null;
  index();
  lsSet('nasaa_dados', { data: d, offset: S.offset });
  initDefaults();
}

function initDefaults() {
  var d = S.data;
  if (!S.np.art || !IX.art[S.np.art]) {
    var wr = d.artigos.filter(function (a) { return a.rota.length; })[0];
    S.np.art = wr ? wr.cod : (d.artigos[0] ? d.artigos[0].cod : '');
    S.np.cli = IX.art[S.np.art] ? IX.art[S.np.art].cli : '';
  }
  if (!S.fa.cli && d.clientes.length) S.fa.cli = d.clientes[0];
  if (S.conf && !IX.et[S.conf.id]) S.conf = null;
  if (S.menu && !IX.et[S.menu]) S.menu = null;
  if (S.pick && !IX.et[S.pick.id]) S.pick = null;
}

function quiet() {
  var a = document.activeElement;
  var typing = a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA');
  return !(S.conf || S.menu || S.ask || S.pick || typing);
}

/** Pergunta ao servidor se algo mudou (resposta curta quando nada mudou). */
function refresh(force) {
  if (S.refreshing || !ME) return Promise.resolve();
  S.refreshing = true;
  return call('getData', force || !S.data ? null : S.data.ver).then(function (d) {
    S.refreshing = false; S.netErr = false;
    if (d.same) { S.offset = d.now - Date.now(); S.lastSync = new Date(); if (S.data) S.data.today = d.today; renderSync(); return; }
    if (!S.data) { setData(d); Q.forEach(applyLocal); render(); return; }
    if (Q.length || S.sending || !quiet()) { S.pending = d; renderSync(); return; }
    setData(d); render();
  }).catch(function () {
    S.refreshing = false; S.netErr = true; renderSync();
    if (!S.data && ME) document.getElementById('app').innerHTML = '<div class="empty"><h2>Não consegui abrir os dados</h2><p class="muted">Verifique a internet e tente de novo.</p><button class="btn pri" data-a="reload">Tentar de novo</button></div>';
  });
}

function applyPending() {
  if (S.pending && !Q.length && !S.sending) { setData(S.pending); }
}

/* ---------- Fila de ações: aplica na tela na hora, grava em segundo plano ---------- */
function enqueue(fn, args, msg) {
  var op = { opId: uid(), fn: fn, args: args };
  applyLocal(op);
  Q.push(op);
  lsSet('nasaa_fila', Q);
  if (msg) toast(msg);
  render();
  pump();
}

var backoff = 0, retryT = null;
function pump() {
  if (S.sending || !Q.length || !ME) { renderSync(); return; }
  S.sending = true; renderSync();
  var batch = Q.slice(0, 25);
  call('sync', batch).then(function (r) {
    S.sending = false; S.netErr = false; backoff = 0;
    var ids = {}; batch.forEach(function (o) { ids[o.opId] = 1; });
    Q = Q.filter(function (o) { return !ids[o.opId]; });
    lsSet('nasaa_fila', Q);
    var bad = (r.results || []).filter(function (x) { return !x.ok; });
    if (bad.length) toast(bad[0].msg + (bad.length > 1 ? ' (+' + (bad.length - 1) + ')' : ''), true);
    if (Q.length) { pump(); return; }
    renderSync();
    // Tudo gravado: busca a versão oficial (se algo foi recusado, corrige a tela)
    S.pending = null;
    refresh(bad.length > 0);
  }).catch(function (err) {
    S.sending = false; S.netErr = true;
    // Sem permissão: não adianta tentar de novo
    if (err && /Acesso negado|permission/i.test(err.message)) {
      toast(err.message, true);
      var ids = {}; batch.forEach(function (o) { ids[o.opId] = 1; });
      Q = Q.filter(function (o) { return !ids[o.opId]; }); lsSet('nasaa_fila', Q);
      S.netErr = false; refresh(true); return;
    }
    backoff = Math.min(30000, backoff ? backoff * 2 : 3000);
    clearTimeout(retryT); retryT = setTimeout(pump, backoff);
    renderSync();
  });
}

/** Aplica a ação nos dados da tela (mesma regra do servidor). */
function applyLocal(op) {
  var d = S.data; if (!d) return;
  var a = op.args, e, p;
  function et(id) { for (var i = 0; i < d.etapas.length; i++) if (d.etapas[i].id === id) return d.etapas[i]; return null; }
  function pauseE(x, ts) { if (x.st === 'EXECUCAO') { x.acc += Math.max(0, ts - x.t0); x.t0 = 0; x.st = 'PAUSADO'; } }
  function concl(x, ts) { if (x.st === 'EXECUCAO') x.acc += Math.max(0, ts - x.t0); x.t0 = 0; x.st = 'CONCLUIDO'; }
  function logL(x, acao, obs) {
    var pp = d.pedidos.filter(function (q) { return q.pid === x.pid; })[0];
    if (pp) d.log.unshift({ t: hhmm(), acao: acao, ped: pp.ped, cli: pp.cli, sec: nm(x.sec), obs: obs || '', func: x.resp || '' });
  }
  function total(x) { var pp = d.pedidos.filter(function (q) { return q.pid === x.pid; })[0]; return pp ? pp.total : 0; }
  function closeIfDone(pid) {
    var mine = d.etapas.filter(function (x) { return x.pid === pid; });
    if (mine.length && mine.every(function (x) { return x.st === 'CONCLUIDO'; })) {
      d.pedidos = d.pedidos.filter(function (q) { return q.pid !== pid; });
      d.etapas = d.etapas.filter(function (x) { return x.pid !== pid; });
    }
  }
  switch (op.fn) {
    case 'iniciar': case 'retomar':
      e = et(a[0]);
      if (e && (e.st === 'AGUARDANDO' || e.st === 'PAUSADO')) {
        var fu = (d.funcionarios || []).filter(function (f) { return f.id === a[2]; })[0];
        e.rid = fu ? fu.id : ''; e.resp = fu ? fu.nome : '';
        logL(e, e.st === 'PAUSADO' ? 'RETOMADA' : 'INÍCIO'); e.st = 'EXECUCAO'; e.t0 = a[1];
      }
      break;
    case 'pausar':
      e = et(a[0]); if (e && e.st === 'EXECUCAO') { pauseE(e, a[1]); logL(e, 'PAUSA'); }
      break;
    case 'apontar':
      e = et(a[0]);
      if (e && e.st !== 'CONCLUIDO') {
        e.feitas += a[1];
        var fecha = e.feitas >= total(e);
        if (fecha) concl(e, a[2]);
        logL(e, fecha ? 'FINALIZAÇÃO' : 'APONTAMENTO', e.feitas + '/' + total(e) + ' pç no setor');
        if (fecha) closeIfDone(e.pid);
      }
      break;
    case 'finalizar':
      e = et(a[0]);
      if (e && e.st !== 'CONCLUIDO') { e.feitas += a[1]; concl(e, a[2]); logL(e, 'FINALIZAÇÃO', e.feitas + '/' + total(e) + ' pç no setor'); closeIfDone(e.pid); }
      break;
    case 'pausarTodos':
      d.etapas.forEach(function (x) { if (x.st === 'EXECUCAO' && (!a[0] || x.sec === a[0])) { pauseE(x, a[1]); logL(x, a[0] ? 'PAUSA DO SETOR' : 'PAUSA GERAL'); } });
      break;
    case 'incluirSetor':
      p = d.pedidos.filter(function (q) { return q.pid === a[0]; })[0];
      if (p && p.rota.indexOf(a[1]) < 0) {
        var oi = ordSec(a[1]), pos = p.rota.length;
        for (var i = 0; i < p.rota.length; i++) { if (ordSec(p.rota[i]) > oi) { pos = i; break; } }
        p.rota.splice(pos, 0, a[1]);
        p.extras.push(a[1]);
        d.etapas.push({ id: a[2], pid: p.pid, sec: a[1], st: 'AGUARDANDO', feitas: 0, acc: 0, t0: 0 });
        d.log.unshift({ t: hhmm(), acao: 'SETOR INCLUÍDO', ped: p.ped, cli: p.cli, sec: nm(a[1]), obs: '' });
      }
      break;
  }
  index();
}

/* Cadastros: gravação direta (são raros) */
function direct(fn, payload) {
  S.busy = true; render();
  return call(fn, payload).then(function (r) {
    S.busy = false;
    if (r.ok) toast(r.msg); else toast(r.msg, true);
    if (Q.length || S.sending) S.pending = r.data; else setData(r.data);
    render();
    return r.ok;
  }).catch(function (err) {
    S.busy = false;
    if (err && /Acesso negado|permission/i.test(err.message)) toast('Você não tem permissão para esta ação.', true);
    else { S.netErr = true; toast('Sem conexão com o servidor. Tente de novo.', true); }
    render();
    return false;
  });
}

/* =====================================================================
   Toast, cronômetros e indicador de gravação
   ===================================================================== */
var toastT = null;
function toast(msg, isErr) {
  if (!msg) return;
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isErr ? ' err' : '');
  t.style.display = 'block';
  clearTimeout(toastT);
  toastT = setTimeout(function () { t.style.display = 'none'; }, isErr ? 6000 : 2500);
}

setInterval(function () {
  var els = document.querySelectorAll('[data-t]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var acc = +el.getAttribute('data-acc'), t0 = +el.getAttribute('data-t0'), st = el.getAttribute('data-st');
    el.textContent = fmt(acc + (st === 'EXECUCAO' && t0 ? nowMs() - t0 : 0));
  }
}, 1000);

function timerHtml(e, cls) {
  return '<span class="' + (cls || 'timer') + ' t-' + e.st + '" data-t="1" data-acc="' + e.acc + '" data-t0="' + e.t0 + '" data-st="' + e.st + '">' + fmt(elapsed(e)) + '</span>';
}

function renderSync() {
  var el = document.getElementById('sync');
  if (!el) return;
  var n = Q.length;
  if (S.netErr && n) { el.className = 'sync off'; el.innerHTML = '<span class="d"></span>Sem conexão · ' + plural(n, 'ação guardada', 'ações guardadas') + ' no aparelho'; }
  else if (S.netErr) { el.className = 'sync off'; el.innerHTML = '<span class="d"></span>Sem conexão'; }
  else if (n || S.sending) { el.className = 'sync busy'; el.innerHTML = '<span class="d"></span>Salvando' + (n ? ' ' + n : '') + '…'; }
  else { el.className = 'sync'; el.innerHTML = '<span class="d"></span>Tudo salvo'; }
  var f = document.getElementById('lastsync');
  if (f && S.lastSync) f.textContent = S.lastSync.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/* =====================================================================
   Telas
   ===================================================================== */
function render() {
  if (!ME) return;

  if (S.view === 'usr') { document.getElementById('app').innerHTML = vUsr(); renderSync(); return; }
  if (S.view === 'senha') { document.getElementById('app').innerHTML = vSenha(); renderSync(); return; }
  if (!S.data) return;
  var html = '';

  else if (S.view === 'sec') html = vSec();
  else if (S.view === 'novo') html = vNovo();

/* ---------- Tela do setor ---------- */
var FILTROS = [['all', 'Todos'], ['run', 'Em execução'], ['pause', 'Pausados'], ['wait', 'Aguardando'], ['late', 'Atrasados']];
function secItems() {
  var rank = { EXECUCAO: 0, PAUSADO: 1, AGUARDANDO: 2 };
  return S.data.etapas.filter(function (e) { return e.sec === S.sec && e.st !== 'CONCLUIDO'; }).sort(function (a, b) {
    var pa = IX.ped[a.pid], pb = IX.ped[b.pid];
    return (rank[a.st] - rank[b.st]) || ((isLate(pb) ? 1 : 0) - (isLate(pa) ? 1 : 0)) || String(pa.prazo).localeCompare(String(pb.prazo));
  });
}
function matchFilt(e, f) {
  if (f === 'run') return e.st === 'EXECUCAO';
  if (f === 'pause') return e.st === 'PAUSADO';
  if (f === 'wait') return e.st === 'AGUARDANDO';
  if (f === 'late') return isLate(IX.ped[e.pid]);
  return true;
}
function matchQ(e) {
  var q = S.q.trim().toLowerCase();
  if (!q) return true;
  var p = IX.ped[e.pid];
  return (p.cli + ' ' + p.ped + ' ' + p.cod).toLowerCase().indexOf(q) >= 0;
}
function shownItems() { return secItems().filter(function (e) { return matchFilt(e, S.filt) && matchQ(e); }); }

function vSec() {
  var all = secItems();

    '<div class="row muted" style="gap:20px"><span><b class="mono" style="font-size:20px;color:var(--ink)">' + all.length + '</b> pedidos</span>' +

  if (run) {
    h += '<div class="box row mb"><div class="grow muted">' + plural(run, 'pedido rodando', 'pedidos rodando') + ' neste setor.</div>' +

        : '<button class="btn out md" data-a="ask-sec">' + I.pause + 'Pausar o setor inteiro</button>') + '</div>';

    h += '<details class="more-sec"><summary>Concluídos neste setor (' + done.length + ')</summary><div class="list">' + done.map(function (e) {
      var p = IX.ped[e.pid];
